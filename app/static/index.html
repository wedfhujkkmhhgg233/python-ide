<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>Python IDE</title>
    <!-- =========================
         CODE EDITOR (CodeMirror)
         Provides syntax highlighting,
         auto-indent, bracket matching,
         and auto-closing brackets.
    ========================= -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css"
    >
    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"
    ></script>
    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"
    ></script>
    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"
    ></script>
    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"
    ></script>
    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/selection/active-line.min.js"
    ></script>
    <!-- =========================
         TERMINAL (xterm.js)
         A real, interactive terminal
         attached to a shell process
         running server-side.
    ========================= -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.min.css"
    >
    <script
        src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.min.js"
    ></script>
    <script
        src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.min.js"
    ></script>
    <script
        src="https://cdn.jsdelivr.net/npm/@xterm/addon-webgl@0.18.0/lib/addon-webgl.min.js"
    ></script>
    <script
        src="https://cdn.jsdelivr.net/npm/@xterm/addon-canvas@0.7.0/lib/addon-canvas.min.js"
    ></script>
    <style>
        * {
            box-sizing: border-box;
        }
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            /*
             * 100dvh accounts for mobile browser chrome
             * (address bar, nav bar) showing/hiding, so the
             * layout doesn't get cut off or leave a gap on
             * phones. Falls back to 100% on browsers that
             * don't support dvh.
             */
            height: 100dvh;
            overflow: hidden;
        }
        body {
            display: flex;
            flex-direction: column;
            background: #0d1117;
            color: #e6edf3;
            font-family:
                Arial,
                sans-serif;
        }
        /* =========================
           HEADER
        ========================= */
        header {
            height: 56px;
            min-height: 56px;
            display: flex;
            align-items: center;
            gap: 7px;
            padding: 0 10px;
            background: #161b22;
            border-bottom: 1px solid #30363d;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 7px;
            font-size: 16px;
            font-weight: bold;
            margin-right: auto;
            white-space: nowrap;
        }
        .logo-icon {
            font-size: 20px;
        }
        button {
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 8px 11px;
            background: #21262d;
            color: #e6edf3;
            font-size: 13px;
            cursor: pointer;
            white-space: nowrap;
        }
        button:hover {
            background: #30363d;
        }
        button:active {
            transform: translateY(1px);
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .run-button {
            background: #238636;
            border-color: #2ea043;
        }
        .run-button:hover {
            background: #2ea043;
        }
        /* =========================
           MOBILE HAMBURGER + DRAWER
           (hidden on desktop; enabled
           in the mobile media query
           below)
        ========================= */
        #hamburger {
            display: none;
            width: 36px;
            height: 36px;
            padding: 0;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
        }
        #backdrop {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 90;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }
        #backdrop.show {
            opacity: 1;
            pointer-events: auto;
        }
        /* =========================
           MOBILE BOTTOM TAB BAR
           (Editor / Output switch;
           hidden on desktop)
        ========================= */
        #mobileTabs {
            display: none;
            height: 52px;
            min-height: 52px;
            background: #161b22;
            border-top: 1px solid #30363d;
        }
        #mobileTabs button {
            flex: 1;
            border: none;
            border-radius: 0;
            border-right: 1px solid #30363d;
            background: transparent;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            font-size: 11px;
            color: #8b949e;
        }
        #mobileTabs button:last-child {
            border-right: none;
        }
        #mobileTabs button.active {
            background: #21262d;
            color: #58a6ff;
        }
        /* =========================
           MAIN WORKSPACE
        ========================= */
        #workspace {
            flex: 1;
            min-height: 0;
            display: flex;
        }
        /* =========================
           SIDEBAR
        ========================= */
        #sidebar {
            width: 235px;
            min-width: 235px;
            display: flex;
            flex-direction: column;
            background: #161b22;
            border-right: 1px solid #30363d;
        }
        .sidebar-header {
            height: 46px;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 7px;
            border-bottom: 1px solid #30363d;
        }
        #projectSelect {
            flex: 1;
            min-width: 0;
            height: 31px;
            padding: 0 7px;
            border: 1px solid #30363d;
            border-radius: 5px;
            outline: none;
            background: #0d1117;
            color: #e6edf3;
        }
        .small-button {
            width: 31px;
            height: 31px;
            padding: 0;
            font-size: 16px;
        }
        .files-title {
            padding: 10px 10px 5px;
            color: #8b949e;
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 0.5px;
        }
        #files {
            flex: 1;
            min-height: 0;
            padding: 4px 7px 10px;
            overflow-y: auto;
        }
        .file {
            display: flex;
            align-items: center;
            gap: 7px;
            width: 100%;
            padding: 8px 8px;
            border-radius: 5px;
            color: #c9d1d9;
            font-family: monospace;
            font-size: 13px;
            cursor: pointer;
            user-select: none;
        }
        .file:hover {
            background: #21262d;
        }
        .file.active {
            background: #30363d;
            color: white;
        }
        .file-icon {
            flex-shrink: 0;
        }
        .file-name {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .empty-files {
            padding: 12px 9px;
            color: #8b949e;
            font-size: 12px;
        }
        /* =========================
           EDITOR AREA
        ========================= */
        #main {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
        }
        #filebar {
            height: 38px;
            min-height: 38px;
            display: flex;
            align-items: center;
            padding: 0 12px;
            background: #0d1117;
            border-bottom: 1px solid #30363d;
        }
        #deleteLineBtn {
            margin-left: auto;
            padding: 5px 10px;
            font-size: 12px;
            min-height: 0;
            flex-shrink: 0;
        }
        #filename {
            font-family: monospace;
            font-size: 13px;
            color: #c9d1d9;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex: 1;
            min-width: 0;
        }
        #dirty {
            margin-left: 7px;
            color: #f0f6fc;
            display: none;
        }
        #editor {
            flex: 1;
            width: 100%;
            min-height: 0;
            resize: none;
            border: none;
            outline: none;
            padding: 15px;
            background: #0d1117;
            color: #e6edf3;
            font-family:
                "Courier New",
                monospace;
            font-size: 15px;
            line-height: 1.55;
            tab-size: 4;
            white-space: pre;
            overflow: auto;
        }
        #editor::placeholder {
            color: #484f58;
        }
        /* =========================
           CODEMIRROR (CODE EDITOR)
        ========================= */
        #main .CodeMirror {
            flex: 1;
            min-height: 0;
            height: 100%;
            width: 100%;
            font-family:
                "Courier New",
                monospace;
            font-size: 15px;
            line-height: 1.55;
        }
        .cm-s-ideDark.CodeMirror {
            background: #0d1117;
            color: #e6edf3;
        }
        .cm-s-ideDark .CodeMirror-gutters {
            background: #0d1117;
            border-right: 1px solid #21262d;
        }
        .cm-s-ideDark .CodeMirror-linenumber {
            color: #484f58;
        }
        .cm-s-ideDark .CodeMirror-cursor {
            border-left: 1px solid #e6edf3;
        }
        .cm-s-ideDark .CodeMirror-selected {
            background: #264f78;
        }
        .cm-s-ideDark .CodeMirror-activeline-background {
            background: rgba(255, 255, 255, 0.05);
        }
        .cm-s-ideDark .CodeMirror-matchingbracket {
            color: #58a6ff !important;
            background: rgba(88, 166, 255, 0.15);
        }
        .cm-s-ideDark .cm-keyword {
            color: #ff7b72;
        }
        .cm-s-ideDark .cm-def {
            color: #d2a8ff;
        }
        .cm-s-ideDark .cm-variable,
        .cm-s-ideDark .cm-variable-2,
        .cm-s-ideDark .cm-variable-3,
        .cm-s-ideDark .cm-property {
            color: #79c0ff;
        }
        .cm-s-ideDark .cm-operator {
            color: #ff7b72;
        }
        .cm-s-ideDark .cm-comment {
            color: #8b949e;
            font-style: italic;
        }
        .cm-s-ideDark .cm-string,
        .cm-s-ideDark .cm-string-2 {
            color: #a5d6ff;
        }
        .cm-s-ideDark .cm-number,
        .cm-s-ideDark .cm-atom {
            color: #79c0ff;
        }
        .cm-s-ideDark .cm-meta {
            color: #d2a8ff;
        }
        .cm-s-ideDark .cm-builtin {
            color: #ffa657;
        }
        .cm-s-ideDark .cm-error {
            color: #f85149;
        }
        /* =========================
           FILE CONTEXT MENU
           (right-click / long-press
           on a file to rename or
           delete it)
        ========================= */
        #fileContextMenu {
            display: none;
            position: fixed;
            z-index: 200;
            min-width: 150px;
            background: #21262d;
            border: 1px solid #30363d;
            border-radius: 7px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            padding: 4px;
            overflow: hidden;
        }
        #fileContextMenu.show {
            display: block;
        }
        #fileContextMenu button {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
            border: none;
            border-radius: 5px;
            background: transparent;
            padding: 9px 10px;
            font-size: 13px;
            text-align: left;
        }
        #fileContextMenu button:hover {
            background: #30363d;
        }
        #fileContextMenu button.danger {
            color: #f85149;
        }
        /* =========================
           TERMINAL
        ========================= */
        #terminal {
            height: 190px;
            min-height: 120px;
            display: flex;
            flex-direction: column;
            background: #010409;
            border-top: 1px solid #30363d;
        }
        .terminal-header {
            height: 36px;
            min-height: 36px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 8px 0 4px;
            border-bottom: 1px solid #21262d;
            color: #8b949e;
            font-size: 12px;
            font-weight: bold;
        }
        .term-tabs {
            display: flex;
            align-items: center;
            height: 100%;
        }
        .term-tab {
            background: transparent;
            border: none;
            border-bottom: 2px solid transparent;
            border-radius: 0;
            color: #8b949e;
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 0.5px;
            height: 100%;
            padding: 0 10px;
            cursor: pointer;
        }
        .term-tab:hover {
            background: transparent;
            color: #e6edf3;
        }
        .term-tab.active {
            color: #e6edf3;
            border-bottom-color: #58a6ff;
        }
        .term-toolbar {
            display: none;
            align-items: center;
            gap: 6px;
        }
        .term-toolbar.show {
            display: flex;
        }
        .term-tool-btn {
            padding: 3px 8px;
            font-size: 11px;
            min-height: 0;
        }
        .term-status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #6e7681;
            flex-shrink: 0;
        }
        .term-status-dot.connecting {
            background: #d29922;
        }
        .term-status-dot.connected {
            background: #3fb950;
        }
        .term-status-dot.error {
            background: #f85149;
        }
        .term-pane {
            display: none;
            flex: 1;
            min-height: 0;
            flex-direction: column;
        }
        .term-pane.active {
            display: flex;
        }
        #output {
            flex: 1;
            min-height: 0;
            margin: 0;
            padding: 11px 12px;
            overflow: auto;
            white-space: pre-wrap;
            word-break: break-word;
            color: #e6edf3;
            font-family:
                "Courier New",
                monospace;
            font-size: 13px;
            line-height: 1.5;
        }
        #xtermContainer {
            flex: 1;
            min-height: 0;
            padding: 8px 4px 4px 8px;
            overflow: hidden;
        }
        #xtermContainer .xterm {
            height: 100%;
        }
        #xtermContainer .xterm-viewport {
            /* let the browser's compositor handle scrolling
               instead of routing every touch through JS */
            touch-action: pan-y;
        }
        /* =========================
           MOBILE
        ========================= */
        @media (max-width: 700px) {
            header {
                padding: 0 7px;
                gap: 4px;
            }
            .logo {
                font-size: 14px;
            }
            .logo-icon {
                font-size: 18px;
            }
            button {
                /* larger tap targets on touch screens */
                min-height: 40px;
                padding: 8px 10px;
                font-size: 12px;
            }
            #hamburger {
                display: flex;
            }
            /*
             * Sidebar becomes a slide-in drawer that overlays
             * the workspace instead of squeezing the editor
             * into a sliver of the screen.
             */
            #sidebar {
                position: fixed;
                top: 56px;
                left: 0;
                bottom: 0;
                width: 82vw;
                max-width: 300px;
                min-width: 0;
                z-index: 100;
                transform: translateX(-100%);
                transition: transform 0.22s ease;
                box-shadow: 2px 0 16px rgba(0, 0, 0, 0.55);
            }
            #sidebar.open {
                transform: translateX(0);
            }
            #backdrop {
                display: block;
                top: 56px;
            }
            #mobileTabs {
                display: flex;
            }
            /*
             * Only one of Editor / Output is shown at a time
             * on mobile, controlled by data-mobile-view on
             * <body>, and switched via #mobileTabs.
             */
            body[data-mobile-view="editor"] #terminal {
                display: none;
            }
            body[data-mobile-view="output"] #editor,
            body[data-mobile-view="output"] .CodeMirror,
            body[data-mobile-view="output"] #filebar {
                display: none;
            }
            body[data-mobile-view="output"] #terminal {
                flex: 1;
                height: auto;
            }
            #terminal {
                height: 100%;
            }
            #main .CodeMirror {
                /* keep >=16px so iOS/Android don't zoom in on focus */
                font-size: 16px;
            }
            #projectSelect {
                font-size: 16px;
            }
            #deleteLineBtn {
                padding: 7px 10px;
                font-size: 13px;
            }
        }
        @media (max-width: 480px) {
            .logo-text {
                display: none;
            }
            #sidebar {
                width: 86vw;
            }
            button {
                font-size: 11px;
                padding: 8px 8px;
            }
        }
    </style>
</head>
<body data-mobile-view="editor">
<!-- =========================
     HEADER
========================= -->
<header>
    <button
        id="hamburger"
        onclick="toggleSidebar()"
        title="Projects & files"
        aria-label="Open projects and files"
    >
        ☰
    </button>
    <div class="logo">
        <span class="logo-icon">
            🐍
        </span>
        <span class="logo-text">
            Python IDE
        </span>
    </div>
    <button
        onclick="newProject()"
        title="Create a new project"
    >
        ＋ Project
    </button>
    <button
        onclick="newFile()"
        title="Create a new file"
    >
        ＋ File
    </button>
    <button
        onclick="saveFile()"
        title="Save current file"
    >
        💾 Save
    </button>
    <button
        id="runButton"
        class="run-button"
        onclick="runCurrent()"
        title="Run current Python file in the terminal"
    >
        ▶ Run
    </button>
    <button
        id="installButton"
        onclick="installRequirements()"
        title="pip install -r requirements.txt"
    >
        📦 Install
    </button>
</header>
<!-- =========================
     WORKSPACE
========================= -->
<!-- Tapping the backdrop closes the mobile drawer -->
<div
    id="backdrop"
    onclick="closeSidebar()"
></div>
<div id="workspace">
    <!-- =====================
         SIDEBAR
    ====================== -->
    <aside id="sidebar">
        <div class="sidebar-header">
            <select
                id="projectSelect"
                onchange="switchProject()"
            >
            </select>
            <button
                class="small-button"
                onclick="newProject()"
                title="New project"
            >
                ＋
            </button>
        </div>
        <div class="files-title">
            PROJECT FILES
        </div>
        <div id="files">
            <div class="empty-files">
                Loading...
            </div>
        </div>
    </aside>
    <!-- =====================
         MAIN
    ====================== -->
    <main id="main">
        <div id="filebar">
            <span id="filename">
                No file selected
            </span>
            <span id="dirty">
                ●
            </span>
            <button
                id="deleteLineBtn"
                onclick="deleteCurrentLines(cm); cm.focus();"
                title="Delete current line (Ctrl+Shift+K)"
            >
                🗑️ Line
            </button>
        </div>
        <textarea
            id="editor"
            spellcheck="false"
            autocomplete="off"
            autocorrect="off"
            autocapitalize="off"
            placeholder="Select a file..."
        ></textarea>
        <!-- =================
             TERMINAL
        ================== -->
        <section id="terminal">
            <div class="terminal-header">
                <div class="term-tabs">
                    <button
                        id="outputTabBtn"
                        class="term-tab active"
                        onclick="setBottomTab('output')"
                    >
                        OUTPUT
                    </button>
                    <button
                        id="terminalTabBtn"
                        class="term-tab"
                        onclick="setBottomTab('terminal')"
                    >
                        TERMINAL
                    </button>
                </div>
                <div
                    id="terminalToolbar"
                    class="term-toolbar"
                >
                    <span
                        id="termStatusDot"
                        class="term-status-dot"
                        title="Disconnected"
                    ></span>
                    <button
                        class="term-tool-btn"
                        onclick="restartTerminal()"
                        title="Start a fresh shell"
                    >
                        ⟳ Restart
                    </button>
                    <button
                        class="term-tool-btn"
                        onclick="clearTerminalView()"
                        title="Clear the screen"
                    >
                        🧹 Clear
                    </button>
                </div>
            </div>
            <div
                id="outputPane"
                class="term-pane active"
            >
                <pre id="output">Ready.</pre>
            </div>
            <div
                id="xtermPane"
                class="term-pane"
            >
                <div id="xtermContainer"></div>
            </div>
        </section>
    </main>
</div>
<!-- =========================
     MOBILE TAB BAR
     (switches between the
     code editor and the
     terminal/output on small
     screens; hidden on desktop)
========================= -->
<nav id="mobileTabs">
    <button
        id="tabEditorBtn"
        class="active"
        onclick="setMobileView('editor')"
    >
        <span>📝</span>
        <span>Editor</span>
    </button>
    <button
        id="tabOutputBtn"
        onclick="setMobileView('output')"
    >
        <span>💻</span>
        <span>Output</span>
    </button>
</nav>
<!-- =========================
     FILE CONTEXT MENU
     (right-click or long-press
     a file in the sidebar)
========================= -->
<div id="fileContextMenu">
    <button
        id="renameFileBtn"
        onclick="renameSelectedFile()"
    >
        ✏️ Rename
    </button>
    <button
        id="deleteFileBtn"
        class="danger"
        onclick="deleteSelectedFile()"
    >
        🗑️ Delete
    </button>
</div>
<script>
/* =====================================================
   STATE
===================================================== */
let currentProject = null;
let currentFile = null;
const editor = document.getElementById("editor");
/*
 * CodeMirror gives us syntax highlighting, auto-indent,
 * bracket matching, and auto-closing brackets on top of
 * the plain textarea. `cm` is what the rest of the app
 * reads/writes instead of editor.value directly.
 */
/*
 * Deletes the line(s) the cursor/selection is on,
 * including the line break - like VS Code's Ctrl+Shift+K.
 * Plain Backspace/Delete only remove one character at a
 * time (which merges lines one at a time); this removes a
 * whole line (or every line touched by the selection) in
 * one step.
 */
function deleteCurrentLines(instance) {
    const from = instance.getCursor("start");
    const to = instance.getCursor("end");
    const lastLine = instance.lastLine();
    if (to.line < lastLine) {
        instance.replaceRange(
            "",
            { line: from.line, ch: 0 },
            { line: to.line + 1, ch: 0 }
        );
    }
    else if (from.line > 0) {
        instance.replaceRange(
            "",
            {
                line: from.line - 1,
                ch: instance.getLine(from.line - 1).length
            },
            { line: to.line, ch: instance.getLine(to.line).length }
        );
    }
    else {
        instance.replaceRange(
            "",
            { line: 0, ch: 0 },
            { line: 0, ch: instance.getLine(0).length }
        );
    }
}
const cm =
    CodeMirror.fromTextArea(
        editor,
        {

/* =====================================================
   INTERACTIVE TERMINAL (xterm.js + WebSocket)
   A real shell running server-side, in the project's
   folder. This is what "Run" uses (so scripts run with
   no timeout and input() works), and it's also just a
   normal terminal you can type into - `pip install x`,
   `ls`, whatever.

function loadTerminalRenderer(termInstance) {
    try {
        const webgl = new WebglAddon.WebglAddon();
        webgl.onContextLoss(() => {
            /*
             * Mobile browsers can yank the WebGL context
             * (e.g. tab backgrounded, too many contexts
             * open elsewhere). Drop back to Canvas instead
             * of silently reverting to the slow DOM renderer.
             */
            webgl.dispose();
            try {
                termInstance.loadAddon(
                    new CanvasAddon.CanvasAddon()
                );
            } catch {}
        });
        termInstance.loadAddon(webgl);
    } catch {
        try {
            termInstance.loadAddon(
                new CanvasAddon.CanvasAddon()
            );
        } catch {}
    }
}
function ensureTerminalWidget() {
    if (term) {
        return;
    }
    term = new Terminal({
        convertEol: true,
        cursorBlink: true,
        fontFamily: '"Courier New", monospace',
        fontSize: 13,
        scrollback: 5000,
        theme: {
            background: "#010409",
            foreground: "#e6edf3",
            cursor: "#e6edf3"
        }
    });
    fitAddon = new FitAddon.FitAddon();
    term.loadAddon(fitAddon);
    term.open(
        document.getElementById("xtermContainer")

    /*
     * Without a GPU-backed renderer, xterm falls back to
     * painting every glyph as a real DOM node - fine for
     * typing, but scrolling repaints the whole viewport on
     * every pixel of movement, which is what makes mobile
     * scrolling feel heavy/laggy. WebGL fixes that; Canvas
     * is the fallback for browsers/contexts without WebGL
     * (some mobile browsers refuse WebGL in background tabs
     * or after too many contexts are open).
     */
    loadTerminalRenderer(term);
    term.onData((data) => {
        if (
            termSocket &&
            termSocket.readyState === WebSocket.OPEN
        ) {
            termSocket.send(
                JSON.stringify({
                    type: "input",
                    data: data
                })
            );
        }
    });

        if (bottomTab === "terminal") {

                fitAddon.fit();

            sendTermResize();
        }
    });
}
function sendTermResize() {
    if (
        !term ||
        !termSocket ||
        termSocket.readyState !== WebSocket.OPEN

        return;

        JSON.stringify({
            type: "resize",
            cols: term.cols,
            rows: term.rows

}
function connectTerminal(projectId, initialCommand) {
    ensureTerminalWidget();
    if (termSocket) {
        try {
            termSocket.onclose = null;
            termSocket.close();
        } catch {}
        termSocket = null;
    }
    termConnectedProject = projectId;
    termConnecting = true;
    setTermStatus(
        "connecting",
        "Connecting..."
    );
    const proto =
        location.protocol === "https:" ?
            "wss:" :
            "ws:";
    let url =
        `${proto}//${location.host}` +
        `/ws/projects/${encodeURIComponent(projectId)}/terminal`;
    if (initialCommand) {
        /*
         * The server types this in once the shell has
         * actually produced its first prompt. Typing it
         * ourselves right after the socket opens would
         * race the shell's own startup and can garble or
         * drop the first thing sent - better to let the
         * server time it off something real.
         */
        url +=
            "?cmd=" +
            encodeURIComponent(initialCommand);
    }
    const socket = new WebSocket(url);
    socket.binaryType = "arraybuffer";
    socket.onopen = () => {
        termConnecting = false;
        setTermStatus(
            "connected",
            "Connected"
        );
        try {
            fitAddon.fit();
        } catch {}
        sendTermResize();
        term.focus();
    };
    socket.onmessage = (event) => {
        if (event.data instanceof ArrayBuffer) {
            term.write(
                new Uint8Array(event.data)
            );
            return;
        }
        try {
            const msg =
                JSON.parse(event.data);
            if (msg.type === "exit") {
                term.write(
                    "\r\n\x1b[90m[shell exited - " +
                    "click Restart to start a new one]" +
                    "\x1b[0m\r\n"
                );
                setTermStatus(
                    "disconnected",
                    "Shell exited"
                );
            }
            else if (msg.type === "error") {
                term.write(
                    "\r\n\x1b[31m" +
                    msg.message +
                    "\x1b[0m\r\n"
                );
                setTermStatus(
                    "error",
                    msg.message
                );
            }
        }
        catch {
            term.write(event.data);
        }
    };
    socket.onclose = () => {
        termConnecting = false;
        if (termSocket === socket) {
            setTermStatus(
                "disconnected",
                "Disconnected"
            );
        }
    };
    socket.onerror = () => {
        setTermStatus(
            "error",
            "Connection error"
        );
    };
    termSocket = socket;
}
function ensureTerminalConnected() {
    if (!currentProject) {
        return;
    }
    if (
        termConnectedProject === currentProject &&
        termSocket &&
        (
            termSocket.readyState === WebSocket.OPEN ||
            termConnecting

        return;
    }

        term.reset();
    }
    connectTerminal(currentProject);
}
function restartTerminal() {
    if (!currentProject) {

}

function setBottomTab(tab) {
    bottomTab = tab;
    outputTabBtn.classList.toggle(
        "active",
        tab === "output"

        "active",

function shellQuote(value) {

function sendTerminalCommand(command, attempt) {
    if (!currentProject) {
        return;
    }
    attempt = attempt || 0;
    setBottomTab("terminal");
    const needsFreshConnection =
        termConnectedProject !== currentProject ||
        !termSocket ||
        (
            termSocket.readyState !== WebSocket.OPEN &&
            !termConnecting
        );
    if (needsFreshConnection) {
        /*
         * Brand-new shell: pass the command along so the
         * server can type it in once the shell has actually
         * produced its first prompt. (Typing it from here
         * immediately after "open" would race the shell's
         * own startup.)
         */
        connectTerminal(currentProject, command);
        return;
    }
    if (
        termSocket &&
        termSocket.readyState === WebSocket.OPEN
    ) {
        /*
         * Terminal's already open and idle/ready - just
         * type the command directly. (No Ctrl+C first: an
         * interrupt immediately followed by input is itself
         * a race against the shell's redraw and can garble
         * or drop the next thing typed. If something else
         * is already running here, the user can hit Ctrl+C
         * in the terminal themselves before running again.)
         */
        termSocket.send(
            JSON.stringify({
                type: "input",
                data: command + "\r"
            })
        );
    }
    else if (attempt < 40) {
        /*
         * A connection to this same project is already in
         * flight (termConnecting) - wait for it rather than
         * starting a second one.
         */
        setTimeout(
            () => sendTerminalCommand(command, attempt + 1),
            100
        );
    }
}

const fileContextMenuEl = document.getElementById("fileContextMenu");

function showFileContextMenu(

        "show"

    /*
     * Position first, then clamp so the menu never renders
     * off the right/bottom edge of the screen.

    fileContextMenuEl.style.left =
        x + "px";
    fileContextMenuEl.style.top =
        y + "px";
    const rect =
        fileContextMenuEl.getBoundingClientRect();
    const maxLeft =
        window.innerWidth -
        rect.width -
        8;
    const maxTop =
        window.innerHeight -
        rect.height -
        8;
    fileContextMenuEl.style.left =
        Math.min(x, Math.max(8, maxLeft)) +
        "px";
    fileContextMenuEl.style.top =
        Math.min(y, Math.max(8, maxTop)) +
        "px";

/* =====================================================
   API HELPER
===================================================== */
async function api(
    url,
    options = {}
) {
    const response =
        await fetch(
            url,
            options
        );
    let data;
    try {
        data =
            await response.json();
    }
    catch {
        throw new Error(
            "Server returned invalid data."
        );
    }
    if (!response.ok) {
        throw new Error(
            data.error ||
            "Request failed."
        );
    }
    return data;
}
/* =====================================================
   LOAD PROJECTS
===================================================== */
async function loadProjects() {
    try {
        const data =
            await api(
                "/api/projects"
            );
        projectSelect.innerHTML = "";
        for (
            const project
            of data.projects
        ) {
            const option =
                document.createElement(
                    "option"
                );
            option.value = project.id;
            option.textContent = project.name;
            projectSelect.appendChild(
                option
            );
        }
        /*
         * If there are no projects,
         * automatically create one.
         */
        if (
            data.projects.length === 0
        ) {
            await createDefaultProject();
            return;
        }
        /*
         * Select first project.
         */
        currentProject =
            data.projects[0].id;
        projectSelect.value = currentProject;
        currentFile = null;
        await loadFiles();
    }
    catch (error) {
        output.textContent =
            "Startup error:\n" +
            error.message;
    }
}

        name === null

   LOAD FILES

async function loadFiles() {
    if (!currentProject) {
        return;
    }
    try {
        const data =
            await api(
                `/api/projects/${encodeURIComponent(
                    currentProject
                )}/files`
            );
        const container = document.getElementById("files");
        container.innerHTML = "";
        if (
            data.files.length === 0
        ) {
            container.innerHTML =
                `
                <div class="empty-files">
                    No files.
                </div>
                `;
            return;
        }
        for (
            const path
            of data.files
        ) {
            const item =
                document.createElement(
                    "div"
                );
            item.className = "file";
            if (
                path === currentFile
            ) {
                item.classList.add(
                    "active"
                );
            }
            const icon =
                document.createElement(
                    "span"
                );
            icon.className = "file-icon";
            icon.textContent =
                path.endsWith(".py")
                    ? "🐍"
                    : "📄";
            const name =
                document.createElement(
                    "span"
                );
            name.className = "file-name";
            name.textContent = path;
            item.appendChild(
                icon
            );
            item.appendChild(
                name
            );
            item.title = path;
            /*
             * Left click / tap: open the file. Right click
             * (desktop) or a long press (touch) instead opens
             * the rename/delete menu for that file.
             */
            let longPressTimer = null;
            let longPressFired = false;
            item.oncontextmenu =
                (event) => {
                    event.preventDefault();
                    showFileContextMenu(
                        path,
                        event.clientX,
                        event.clientY
                    );
                };
            item.addEventListener(
                "pointerdown",
                (event) => {
                    if (
                        event.pointerType !== "touch"
                    ) {
                        return;
                    }
                    longPressFired = false;
                    longPressTimer =
                        setTimeout(
                            () => {
                                longPressFired = true;
                                if (
                                    navigator.vibrate
                                ) {
                                    navigator.vibrate(
                                        15
                                    );
                                }
                                showFileContextMenu(
                                    path,
                                    event.clientX,
                                    event.clientY
                                );
                            },
                            550
                        );
                }
            );
            const cancelLongPress =
                () => {
                    if (
                        longPressTimer
                    ) {
                        clearTimeout(
                            longPressTimer
                        );
                        longPressTimer = null;
                    }
                };
            item.addEventListener(
                "pointerup",
                cancelLongPress
            );
            item.addEventListener(
                "pointermove",
                cancelLongPress
            );
            item.addEventListener(
                "pointercancel",
                cancelLongPress
            );
            item.onclick =
                () => {
                    if (
                        longPressFired
                    ) {
                        longPressFired = false;
                        return;
                    }
                    openFile(
                        path
                    );
                };
            container.appendChild(
                item
            );
        }
        /*
         * Open first file
         * automatically.
         */
        if (
            !currentFile &&
            data.files.length > 0
        ) {
            await openFile(
                data.files[0]
            );
        }
    }
    catch (error) {
        output.textContent =
            "Could not load files:\n" +
            error.message;
    }
}

    catch (error) {
        output.textContent =
            "Could not open file:\n" +
            error.message;
    }
}
/* =====================================================
   SAVE FILE
===================================================== */
async function saveFile() {
    if (
        !currentProject
    ) {
        return;
    }
    if (
        !currentFile
    ) {
        return;
    }
    try {
        await api(
            `/api/projects/${encodeURIComponent(
                currentProject
            )}/file`,
            {
                method: "POST",
                headers: {
                    "Content-Type":
                        "application/json"
                },
                body:
                    JSON.stringify({
                        path:
                            currentFile,
                        content:
                            cm.getValue()
                    })
            }
        );
        editor.dataset.saved =
            cm.getValue();
        dirtyIndicator.style.display = "none";
        output.textContent =
            "Saved:\n" +
            currentFile;
        await loadFiles();
    }
    catch (error) {
        output.textContent =
            "Save failed:\n" +
            error.message;
        throw error;
    }
}
/* =====================================================
   NEW FILE
===================================================== */
async function newFile() {
    if (!currentProject) {
        alert(
            "Create a project first."
        );
        return;
    }
    const path =
        prompt(
            "File path:",
            "test.py"
        );
    if (
        path === null
    ) {
        return;
    }
    const cleanPath =
        path.trim();
    if (!cleanPath) {
        return;
    }
    try {
        await api(
            `/api/projects/${encodeURIComponent(
                currentProject
            )}/file`,
            {
                method: "POST",
                headers: {
                    "Content-Type":
                        "application/json"
                },
                body:
                    JSON.stringify({
                        path:
                            cleanPath,
                        content:
                            ""
                    })
            }
        );
        await loadFiles();
        await openFile(
            cleanPath
        );
        output.textContent =
            "Created:\n" +
            cleanPath;
    }
    catch (error) {
        alert(
            "Could not create file:\n" +
            error.message
        );
    }
}
/* =====================================================
   RUN PROJECT
===================================================== */
async function runCurrent() {
    if (
        !currentProject
    ) {
        output.textContent = "No project selected.";
        return;
    }
    if (
        !currentFile
    ) {
        output.textContent = "Select a Python file first.";
        return;
    }
    if (
        !currentFile.endsWith(".py")
    ) {
        output.textContent = "Only Python files can be run.";
        return;
    }
    /*
     * Save before running.
     */
    if (
        cm.getValue() !==
        editor.dataset.saved
    ) {
        try {
            await saveFile();
        }
        catch {
            return;
        }
    }
    /*
     * Running now happens in the real interactive
     * terminal instead of the old sandboxed/timed-out
     * subprocess call. This means:
     *
     *  - no artificial time limit
     *  - input() prompts actually work
     *  - normal stdout/stderr colors and formatting
     *  - the process can be interrupted with Ctrl+C
     *    directly in the terminal
     *
     * On mobile this also switches to the Output/Terminal
     * tab so the user doesn't have to switch manually.
     */
    if (
        isMobile()
    ) {
        setMobileView(
            "output"
        );
    }
    sendTerminalCommand(
        "python3 -u " +
        shellQuote(currentFile)
    );
}
/* =====================================================
   EDITOR
   (dirty-state tracking and Tab handling now live on the
   CodeMirror instance itself - see cm.on("change", ...)
   and extraKeys.Tab set up where `cm` is created above.)
===================================================== */
/*
 * Ctrl+S / Cmd+S
 */
document.addEventListener(
    "keydown",
    async function(event) {
        if (
            (event.ctrlKey ||
             event.metaKey)
            &&
            event.key.toLowerCase()
                === "s"
        ) {
            event.preventDefault();
            await saveFile();
        }
    }
);
/*
 * Ctrl+Enter / Cmd+Enter
 * runs the current file.
 */
document.addEventListener(
    "keydown",
    function(event) {
        if (
            (event.ctrlKey ||
             event.metaKey)
            &&
            event.key === "Enter"
        ) {
            event.preventDefault();
            runCurrent();
        }
    }
);
/* =====================================================
   START APPLICATION
===================================================== */
loadProjects();
</script>
