<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>Python IDE</title>
    <!-- =========================
         CODE EDITOR (CodeMirror)
         Provides syntax highlighting,
         auto-indent, bracket matching,
         and auto-closing brackets.
    ========================= -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css"
    >
    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"
    ></script>
    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"
    ></script>
    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"
    ></script>
    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"
    ></script>
    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/selection/active-line.min.js"
    ></script>
    <!-- =========================
         TERMINAL (xterm.js)
         A real, interactive terminal
         attached to a shell process
         running server-side.
    ========================= -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.min.css"
    >
    <script
        src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.min.js"
    ></script>
    <script
        src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.min.js"
    ></script>
    <script
        src="https://cdn.jsdelivr.net/npm/@xterm/addon-webgl@0.18.0/lib/addon-webgl.min.js"
    ></script>
    <script
        src="https://cdn.jsdelivr.net/npm/@xterm/addon-canvas@0.7.0/lib/addon-canvas.min.js"
    ></script>
    <style>
        * {
            box-sizing: border-box;
        }
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            /*
             * 100dvh accounts for mobile browser chrome
             * (address bar, nav bar) showing/hiding, so the
             * layout doesn't get cut off or leave a gap on
             * phones. Falls back to 100% on browsers that
             * don't support dvh.
             */
            height: 100dvh;
            overflow: hidden;
        }
        body {
            display: flex;
            flex-direction: column;
            background: #0d1117;
            color: #e6edf3;
            font-family:
                Arial,
                sans-serif;
        }
        /* =========================
           HEADER
        ========================= */
        header {
            height: 56px;
            min-height: 56px;
            display: flex;
            align-items: center;
            gap: 7px;
            padding: 0 10px;
            background: #161b22;
            border-bottom: 1px solid #30363d;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 7px;
            font-size: 16px;
            font-weight: bold;
            margin-right: auto;
            white-space: nowrap;
        }
        .logo-icon {
            font-size: 20px;
        }
        button {
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 8px 11px;
            background: #21262d;
            color: #e6edf3;
            font-size: 13px;
            cursor: pointer;
            white-space: nowrap;
        }
        button:hover {
            background: #30363d;
        }
        button:active {
            transform: translateY(1px);
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .run-button {
            background: #238636;
            border-color: #2ea043;
        }
        .run-button:hover {
            background: #2ea043;
        }
        /* =========================
           MOBILE HAMBURGER + DRAWER
           (hidden on desktop; enabled
           in the mobile media query
           below)
        ========================= */
        #hamburger {
            display: none;
            width: 36px;
            height: 36px;
            padding: 0;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
        }
        #backdrop {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 90;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }
        #backdrop.show {
            opacity: 1;
            pointer-events: auto;
        }
        /* =========================
           MOBILE BOTTOM TAB BAR
           (Editor / Output switch;
           hidden on desktop)
        ========================= */
        #mobileTabs {
            display: none;
            height: 52px;
            min-height: 52px;
            background: #161b22;
            border-top: 1px solid #30363d;
        }
        #mobileTabs button {
            flex: 1;
            border: none;
            border-radius: 0;
            border-right: 1px solid #30363d;
            background: transparent;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            font-size: 11px;
            color: #8b949e;
        }
        #mobileTabs button:last-child {
            border-right: none;
        }
        #mobileTabs button.active {
            background: #21262d;
            color: #58a6ff;
        }
        /* =========================
           MAIN WORKSPACE
        ========================= */
        #workspace {
            flex: 1;
            min-height: 0;
            display: flex;
        }
        /* =========================
           SIDEBAR
        ========================= */
        #sidebar {
            width: 235px;
            min-width: 235px;
            display: flex;
            flex-direction: column;
            background: #161b22;
            border-right: 1px solid #30363d;
        }
        .sidebar-header {
            height: 46px;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 7px;
            border-bottom: 1px solid #30363d;
        }
        #projectSelect {
            flex: 1;
            min-width: 0;
            height: 31px;
            padding: 0 7px;
            border: 1px solid #30363d;
            border-radius: 5px;
            outline: none;
            background: #0d1117;
            color: #e6edf3;
        }
        .small-button {
            width: 31px;
            height: 31px;
            padding: 0;
            font-size: 16px;
        }
        .files-title {
            padding: 10px 10px 5px;
            color: #8b949e;
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 0.5px;
        }
        #files {
            flex: 1;
            min-height: 0;
            padding: 4px 7px 10px;
            overflow-y: auto;
        }
        .file {
            display: flex;
            align-items: center;
            gap: 7px;
            width: 100%;
            padding: 8px 8px;
            border-radius: 5px;
            color: #c9d1d9;
            font-family: monospace;
            font-size: 13px;
            cursor: pointer;
            user-select: none;
        }
        .file:hover {
            background: #21262d;
        }
        .file.active {
            background: #30363d;
            color: white;
        }
        .file-icon {
            flex-shrink: 0;
        }
        .file-name {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .empty-files {
            padding: 12px 9px;
            color: #8b949e;
            font-size: 12px;
        }
        /* =========================
           EDITOR AREA
        ========================= */
        #main {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
        }
        #filebar {
            height: 38px;
            min-height: 38px;
            display: flex;
            align-items: center;
            padding: 0 12px;
            background: #0d1117;
            border-bottom: 1px solid #30363d;
        }
        #deleteLineBtn {
            margin-left: auto;
            padding: 5px 10px;
            font-size: 12px;
            min-height: 0;
            flex-shrink: 0;
        }
        #filename {
            font-family: monospace;
            font-size: 13px;
            color: #c9d1d9;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex: 1;
            min-width: 0;
        }
        #dirty {
            margin-left: 7px;
            color: #f0f6fc;
            display: none;
        }
        #editor {
            flex: 1;
            width: 100%;
            min-height: 0;
            resize: none;
            border: none;
            outline: none;
            padding: 15px;
            background: #0d1117;
            color: #e6edf3;
            font-family:
                "Courier New",
                monospace;
            font-size: 15px;
            line-height: 1.55;
            tab-size: 4;
            white-space: pre;
            overflow: auto;
        }
        #editor::placeholder {
            color: #484f58;
        }
        /* =========================
           CODEMIRROR (CODE EDITOR)
        ========================= */
        #main .CodeMirror {
            flex: 1;
            min-height: 0;
            height: 100%;
            width: 100%;
            font-family:
                "Courier New",
                monospace;
            font-size: 15px;
            line-height: 1.55;
        }
        .cm-s-ideDark.CodeMirror {
            background: #0d1117;
            color: #e6edf3;
        }
        .cm-s-ideDark .CodeMirror-gutters {
            background: #0d1117;
            border-right: 1px solid #21262d;
        }
        .cm-s-ideDark .CodeMirror-linenumber {
            color: #484f58;
        }
        .cm-s-ideDark .CodeMirror-cursor {
            border-left: 1px solid #e6edf3;
        }
        .cm-s-ideDark .CodeMirror-selected {
            background: #264f78;
        }
        .cm-s-ideDark .CodeMirror-activeline-background {
            background: rgba(255, 255, 255, 0.05);
        }
        .cm-s-ideDark .CodeMirror-matchingbracket {
            color: #58a6ff !important;
            background: rgba(88, 166, 255, 0.15);
        }
        .cm-s-ideDark .cm-keyword {
            color: #ff7b72;
        }
        .cm-s-ideDark .cm-def {
            color: #d2a8ff;
        }
        .cm-s-ideDark .cm-variable,
        .cm-s-ideDark .cm-variable-2,
        .cm-s-ideDark .cm-variable-3,
        .cm-s-ideDark .cm-property {
            color: #79c0ff;
        }
        .cm-s-ideDark .cm-operator {
            color: #ff7b72;
        }
        .cm-s-ideDark .cm-comment {
            color: #8b949e;
            font-style: italic;
        }
        .cm-s-ideDark .cm-string,
        .cm-s-ideDark .cm-string-2 {
            color: #a5d6ff;
        }
        .cm-s-ideDark .cm-number,
        .cm-s-ideDark .cm-atom {
            color: #79c0ff;
        }
        .cm-s-ideDark .cm-meta {
            color: #d2a8ff;
        }
        .cm-s-ideDark .cm-builtin {
            color: #ffa657;
        }
        .cm-s-ideDark .cm-error {
            color: #f85149;
        }
        /* =========================
           FILE CONTEXT MENU
           (right-click / long-press
           on a file to rename or
           delete it)
        ========================= */
        #fileContextMenu {
            display: none;
            position: fixed;
            z-index: 200;
            min-width: 150px;
            background: #21262d;
            border: 1px solid #30363d;
            border-radius: 7px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            padding: 4px;
            overflow: hidden;
        }
        #fileContextMenu.show {
            display: block;
        }
        #fileContextMenu button {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
            border: none;
            border-radius: 5px;
            background: transparent;
            padding: 9px 10px;
            font-size: 13px;
            text-align: left;
        }
        #fileContextMenu button:hover {
            background: #30363d;
        }
        #fileContextMenu button.danger {
            color: #f85149;
        }
        /* =========================
           TERMINAL
        ========================= */
        #terminal {
            height: 190px;
            min-height: 120px;
            display: flex;
            flex-direction: column;
            background: #010409;
            border-top: 1px solid #30363d;
        }
        .terminal-header {
            height: 36px;
            min-height: 36px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 8px 0 4px;
            border-bottom: 1px solid #21262d;
            color: #8b949e;
            font-size: 12px;
            font-weight: bold;
        }
        .term-tabs {
            display: flex;
            align-items: center;
            height: 100%;
        }
        .term-tab {
            background: transparent;
            border: none;
            border-bottom: 2px solid transparent;
            border-radius: 0;
            color: #8b949e;
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 0.5px;
            height: 100%;
            padding: 0 10px;
            cursor: pointer;
        }
        .term-tab:hover {
            background: transparent;
            color: #e6edf3;
        }
        .term-tab.active {
            color: #e6edf3;
            border-bottom-color: #58a6ff;
        }
        .term-toolbar {
            display: none;
            align-items: center;
            gap: 6px;
        }
        .term-toolbar.show {
            display: flex;
        }
        .term-tool-btn {
            padding: 3px 8px;
            font-size: 11px;
            min-height: 0;
        }
        .term-status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #6e7681;
            flex-shrink: 0;
        }
        .term-status-dot.connecting {
            background: #d29922;
        }
        .term-status-dot.connected {
            background: #3fb950;
        }
        .term-status-dot.error {
            background: #f85149;
        }
        .term-pane {
            display: none;
            flex: 1;
            min-height: 0;
            flex-direction: column;
        }
        .term-pane.active {
            display: flex;
        }
        #xtermPane {
            position: relative;
        }
        #output {
            flex: 1;
            min-height: 0;
            margin: 0;
            padding: 11px 12px;
            overflow: auto;
            white-space: pre-wrap;
            word-break: break-word;
            color: #e6edf3;
            font-family:
                "Courier New",
                monospace;
            font-size: 13px;
            line-height: 1.5;
        }
        #xtermContainer {
            flex: 1;
            min-height: 0;
            padding: 8px 4px 4px 8px;
            overflow: hidden;
        }
        #xtermContainer .xterm {
            height: 100%;
        }
        #xtermContainer .xterm-viewport {
            /* let the browser's compositor handle scrolling
               instead of routing every touch through JS */
            touch-action: pan-y;
            /* without this, touch-drag scrolls the viewport
               only exactly as far as the finger physically
               moves and stops dead on lift - no momentum/
               fling. This restores native inertial scroll. */
            -webkit-overflow-scrolling: touch;
            overflow-y: scroll !important;
        }
        #termToast {
            position: absolute;
            left: 50%;
            bottom: 14px;
            transform: translateX(-50%) translateY(6px);
            background: #1f6feb;
            color: #fff;
            font-size: 12px;
            font-weight: bold;
            padding: 6px 12px;
            border-radius: 6px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.15s ease, transform 0.15s ease;
            z-index: 20;
        }
        #termToast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        /* =========================
           CAMERA
        ========================= */
        #cameraPane {
            position: relative;
        }
        #cameraStage {
            flex: 1;
            min-height: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            position: relative;
            overflow: hidden;
        }
        #cameraVideoEl,
        #cameraCaptureCanvas {
            /* only used internally to grab frames - the
               actual visible output is the processed feed
               coming back from the server */
            display: none;
        }
        #cameraDisplayCanvas {
            max-width: 100%;
            max-height: 100%;
            display: none;
        }
        #cameraDisplayCanvas.show {
            display: block;
        }
        #cameraPlaceholder {
            color: #8b949e;
            font-size: 13px;
            text-align: center;
            padding: 0 24px;
            line-height: 1.6;
        }
        #cameraPlaceholder.hide {
            display: none;
        }
        #cameraFps {
            position: absolute;
            top: 8px;
            right: 10px;
            background: rgba(0, 0, 0, 0.55);
            color: #56d364;
            font-size: 11px;
            font-weight: bold;
            padding: 2px 7px;
            border-radius: 5px;
            display: none;
        }
        #cameraFps.show {
            display: block;
        }
        /* =========================
           MOBILE
        ========================= */
        @media (max-width: 700px) {
            header {
                padding: 0 7px;
                gap: 4px;
            }
            .logo {
                font-size: 14px;
            }
            .logo-icon {
                font-size: 18px;
            }
            button {
                /* larger tap targets on touch screens */
                min-height: 40px;
                padding: 8px 10px;
                font-size: 12px;
            }
            #hamburger {
                display: flex;
            }
            /*
             * Sidebar becomes a slide-in drawer that overlays
             * the workspace instead of squeezing the editor
             * into a sliver of the screen.
             */
            #sidebar {
                position: fixed;
                top: 56px;
                left: 0;
                bottom: 0;
                width: 82vw;
                max-width: 300px;
                min-width: 0;
                z-index: 100;
                transform: translateX(-100%);
                transition: transform 0.22s ease;
                box-shadow: 2px 0 16px rgba(0, 0, 0, 0.55);
            }
            #sidebar.open {
                transform: translateX(0);
            }
            #backdrop {
                display: block;
                top: 56px;
            }
            #mobileTabs {
                display: flex;
            }
            /*
             * Only one of Editor / Output is shown at a time
             * on mobile, controlled by data-mobile-view on
             * <body>, and switched via #mobileTabs.
             */
            body[data-mobile-view="editor"] #terminal {
                display: none;
            }
            body[data-mobile-view="output"] #editor,
            body[data-mobile-view="output"] .CodeMirror,
            body[data-mobile-view="output"] #filebar {
                display: none;
            }
            body[data-mobile-view="output"] #terminal {
                flex: 1;
                height: auto;
            }
            #terminal {
                height: 100%;
            }
            #main .CodeMirror {
                /* keep >=16px so iOS/Android don't zoom in on focus */
                font-size: 16px;
            }
            #projectSelect {
                font-size: 16px;
            }
            #deleteLineBtn {
                padding: 7px 10px;
                font-size: 13px;
            }
        }
        @media (max-width: 480px) {
            .logo-text {
                display: none;
            }
            #sidebar {
                width: 86vw;
            }
            button {
                font-size: 11px;
                padding: 8px 8px;
            }
        }
    </style>
</head>
<body data-mobile-view="editor">
<!-- =========================
     HEADER
========================= -->
<header>
    <button
        id="hamburger"
        onclick="toggleSidebar()"
        title="Projects & files"
        aria-label="Open projects and files"
    >
        ☰
    </button>
    <div class="logo">
        <span class="logo-icon">
            🐍
        </span>
        <span class="logo-text">
            Python IDE
        </span>
    </div>
    <button
        onclick="newProject()"
        title="Create a new project"
    >
        ＋ Project
    </button>
    <button
        onclick="newFile()"
        title="Create a new file"
    >
        ＋ File
    </button>
    <button
        onclick="saveFile()"
        title="Save current file"
    >
        💾 Save
    </button>
    <button
        id="runButton"
        class="run-button"
        onclick="runCurrent()"
        title="Run current Python file in the terminal"
    >
        ▶ Run
    </button>
    <button
        id="installButton"
        onclick="installRequirements()"
        title="pip install -r requirements.txt"
    >
        📦 Install
    </button>
</header>
<!-- =========================
     WORKSPACE
========================= -->
<!-- Tapping the backdrop closes the mobile drawer -->
<div
    id="backdrop"
    onclick="closeSidebar()"
></div>
<div id="workspace">
    <!-- =====================
         SIDEBAR
    ====================== -->
    <aside id="sidebar">
        <div class="sidebar-header">
            <select
                id="projectSelect"
                onchange="switchProject()"
            >
            </select>
            <button
                class="small-button"
                onclick="newProject()"
                title="New project"
            >
                ＋
            </button>
        </div>
        <div class="files-title">
            PROJECT FILES
        </div>
        <div id="files">
            <div class="empty-files">
                Loading...
            </div>
        </div>
    </aside>
    <!-- =====================
         MAIN
    ====================== -->
    <main id="main">
        <div id="filebar">
            <span id="filename">
                No file selected
            </span>
            <span id="dirty">
                ●
            </span>
            <button
                id="deleteLineBtn"
                onclick="deleteCurrentLines(cm); cm.focus();"
                title="Delete current line (Ctrl+Shift+K)"
            >
                🗑️ Line
            </button>
        </div>
        <textarea
            id="editor"
            spellcheck="false"
            autocomplete="off"
            autocorrect="off"
            autocapitalize="off"
            placeholder="Select a file..."
        ></textarea>
        <!-- =================
             TERMINAL
        ================== -->
        <section id="terminal">
            <div class="terminal-header">
                <div class="term-tabs">
                    <button
                        id="outputTabBtn"
                        class="term-tab active"
                        onclick="setBottomTab('output')"
                    >
                        OUTPUT
                    </button>
                    <button
                        id="terminalTabBtn"
                        class="term-tab"
                        onclick="setBottomTab('terminal')"
                    >
                        TERMINAL
                    </button>
                    <button
                        id="cameraTabBtn"
                        class="term-tab"
                        onclick="setBottomTab('camera')"
                    >
                        📷 CAMERA
                    </button>
                </div>
                <div
                    id="terminalToolbar"
                    class="term-toolbar"
                >
                    <span
                        id="termStatusDot"
                        class="term-status-dot"
                        title="Disconnected"
                    ></span>
                    <button
                        class="term-tool-btn"
                        onclick="copyTerminalOutput()"
                        title="Copy selection (or all output if nothing selected)"
                    >
                        📋 Copy
                    </button>
                    <button
                        class="term-tool-btn"
                        onclick="restartTerminal()"
                        title="Start a fresh shell"
                    >
                        ⟳ Restart
                    </button>
                    <button
                        class="term-tool-btn"
                        onclick="clearTerminalView()"
                        title="Clear the screen"
                    >
                        🧹 Clear
                    </button>
                </div>
                <div
                    id="cameraToolbar"
                    class="term-toolbar"
                >
                    <span
                        id="cameraStatusDot"
                        class="term-status-dot"
                        title="Stopped"
                    ></span>
                    <button
                        class="term-tool-btn"
                        id="cameraStartBtn"
                        onclick="toggleCamera()"
                    >
                        ▶ Start
                    </button>

            m[1] +
            termColor(m[2], TERM_ANSI.cyan) +
            m[3] +
            termColor(m[4], TERM_ANSI.yellow) +
            (m[5] ? termColor(m[5], TERM_ANSI.dim) : "")

            termColor(m[1], TERM_ANSI.red, true) +
            m[3] +
            termColor(m[4], TERM_ANSI.yellow)

            !termConnecting

         * Brand-new shell: pass the command along so the

        termSocket &&
        termSocket.readyState === WebSocket.OPEN

        /*
         * Terminal's already open and idle/ready - just
         * type the command directly. (No Ctrl+C first: an
         * interrupt immediately followed by input is itself

            JSON.stringify({

         * A connection to this same project is already in
         * flight (termConnecting) - wait for it rather than

            100

function closeSidebar() {
    sidebarEl.classList.remove(
        "open"
    );
    backdropEl.classList.remove(
        "show"
    );
}
function toggleSidebar() {
    if (
        sidebarEl.classList.contains(
            "open"
        )
    ) {
        closeSidebar();
    }
    else {
        openSidebar();
    }
}
/* =====================================================
   MOBILE: EDITOR / OUTPUT TABS
===================================================== */
function setMobileView(
    view
) {
    document.body.setAttribute(
        "data-mobile-view",
        view
    );
    tabEditorBtn.classList.toggle(
        "active",
        view === "editor"
    );
    tabOutputBtn.classList.toggle(
        "active",
        view === "output"
    );
    if (
        view === "editor"
    ) {
        /*
         * CodeMirror can render blank/misaligned after being
         * toggled with display:none, so nudge it to
         * re-measure itself once it's visible again.
         */
        setTimeout(
            () => cm.refresh(),
            0
        );
    }
}
/* =====================================================
   FILE CONTEXT MENU (rename / delete)
===================================================== */
const fileContextMenuEl = document.getElementById("fileContextMenu");
let contextMenuPath = null;
function showFileContextMenu(
    path,
    x,
    y
) {
    contextMenuPath = path;
    fileContextMenuEl.classList.add(
        "show"
    );
    /*
     * Position first, then clamp so the menu never renders
     * off the right/bottom edge of the screen.
     */
    fileContextMenuEl.style.left =
        x + "px";
    fileContextMenuEl.style.top =
        y + "px";
    const rect =
        fileContextMenuEl.getBoundingClientRect();
    const maxLeft =
        window.innerWidth -
        rect.width -
        8;
    const maxTop =
        window.innerHeight -
        rect.height -
        8;
    fileContextMenuEl.style.left =
        Math.min(x, Math.max(8, maxLeft)) +
        "px";
    fileContextMenuEl.style.top =
        Math.min(y, Math.max(8, maxTop)) +
        "px";
}
function hideFileContextMenu() {
    fileContextMenuEl.classList.remove(
        "show"
    );
    contextMenuPath = null;
}
/*
 * Close the menu on any click/tap outside it, and on
 * scroll (so it doesn't float over the wrong file).
 */
document.addEventListener(
    "pointerdown",
    (event) => {
        if (
            fileContextMenuEl.classList.contains("show") &&
            !fileContextMenuEl.contains(event.target)
        ) {
            hideFileContextMenu();
        }
    }
);
document.addEventListener(
    "scroll",
    hideFileContextMenu,
    true
);
async function renameSelectedFile() {
    const oldPath = contextMenuPath;
    hideFileContextMenu();
    if (
        !oldPath ||
        !currentProject
    ) {
        return;
    }
    const input =
        prompt(
            "Rename file:",
            oldPath
        );
    if (
        input === null
    ) {
        return;
    }
    const newPath =
        input.trim();
    if (
        !newPath ||
        newPath === oldPath
    ) {
        return;
    }
    try {
        await api(
            `/api/projects/${encodeURIComponent(
                currentProject
            )}/file/rename`,
            {
                method: "POST",
                headers: {
                    "Content-Type":
                        "application/json"
                },
                body:
                    JSON.stringify({
                        old_path:
                            oldPath,
                        new_path:
                            newPath
                    })
            }
        );
        /*
         * If the renamed file is the one currently open,
         * keep the editor pointed at its new name/path.
         */
        if (
            currentFile === oldPath
        ) {
            currentFile = newPath;
            filename.textContent = newPath;
        }
        await loadFiles();
    }
    catch (error) {
        output.textContent =
            "Rename failed:\n" +
            error.message;
    }
}
async function deleteSelectedFile() {
    const path = contextMenuPath;
    hideFileContextMenu();
    if (
        !path ||
        !currentProject
    ) {
        return;
    }
    const confirmed =
        confirm(
            `Delete "${path}"?\n\n` +
            "This cannot be undone."
        );
    if (
        !confirmed
    ) {
        return;
    }
    try {
        await api(
            `/api/projects/${encodeURIComponent(
                currentProject
            )}/file?path=${encodeURIComponent(
                path
            )}`,
            {
                method: "DELETE"
            }
        );
        /*
         * If the deleted file was open in the editor,
         * clear it out so we don't keep editing a file
         * that no longer exists.
         */
        if (
            currentFile === path
        ) {
            currentFile = null;
            cm.setValue(
                ""
            );
            editor.dataset.saved = "";
            filename.textContent = "No file selected";
            dirtyIndicator.style.display = "none";
        }
        await loadFiles();
    }
    catch (error) {
        output.textContent =
            "Delete failed:\n" +
            error.message;
    }
}
/* =====================================================
   API HELPER
===================================================== */
async function api(
    url,
    options = {}
) {
    const response =
        await fetch(
            url,
            options
        );
    let data;
    try {
        data =
            await response.json();
    }
    catch {
        throw new Error(
            "Server returned invalid data."
        );
    }
    if (!response.ok) {
        throw new Error(
            data.error ||
            "Request failed."
        );
    }
    return data;
}
/* =====================================================
   LOAD PROJECTS
===================================================== */
async function loadProjects() {
    try {
        const data =
            await api(
                "/api/projects"
            );
        projectSelect.innerHTML = "";
        for (
            const project
            of data.projects
        ) {
            const option =
                document.createElement(
                    "option"
                );
            option.value = project.id;
            option.textContent = project.name;
            projectSelect.appendChild(
                option
            );
        }
        /*
         * If there are no projects,
         * automatically create one.
         */
        if (
            data.projects.length === 0
        ) {
            await createDefaultProject();
            return;
        }
        /*
         * Select first project.
         */
        currentProject =
            data.projects[0].id;
        projectSelect.value = currentProject;
        currentFile = null;
        await loadFiles();
    }
    catch (error) {
        output.textContent =
            "Startup error:\n" +
            error.message;
    }
}
/* =====================================================
   DEFAULT PROJECT
===================================================== */
async function createDefaultProject() {
    const data =
        await api(
            "/api/projects",
            {
                method: "POST",
                headers: {
                    "Content-Type":
                        "application/json"
                },
                body:
                    JSON.stringify({
                        name:
                            "my-project"
                    })
            }
        );
    currentProject = data.id;
    projectSelect.innerHTML = "";
    const option =
        document.createElement(
            "option"
        );
    option.value = data.id;
    option.textContent = data.name;
    projectSelect.appendChild(
        option
    );
    await loadFiles();
}
/* =====================================================
   NEW PROJECT
===================================================== */
async function newProject() {
    const name =
        prompt(
            "Project name:",
            "my-project"
        );
    if (
        name === null
    ) {
        return;
    }
    const trimmed =
        name.trim();
    if (!trimmed) {
        alert(
            "Project name cannot be empty."
        );
        return;
    }
    try {
        const data =
            await api(
                "/api/projects",
                {
                    method: "POST",
                    headers: {
                        "Content-Type":
                            "application/json"
                    },
                    body:
                        JSON.stringify({
                            name:
                                trimmed
                        })
                }
            );
        currentProject = data.id;
        currentFile = null;
        await loadProjects();
        projectSelect.value = data.id;
        currentProject = data.id;
        await loadFiles();
        if (bottomTab === "terminal") {
            ensureTerminalConnected();
        }
        output.textContent =
            "Created project:\n" +
            data.id;

    catch (error) {
        alert(
            "Could not create project:\n" +

}
/* =====================================================
   SWITCH PROJECT
===================================================== */
async function switchProject() {
    const selected = projectSelect.value;
    if (!selected) {
        return;
    }
    /*
     * Warn about unsaved changes.
     */
    if (
        currentFile &&
        cm.getValue() !==
        editor.dataset.saved
    ) {
        const save =
            confirm(
                "You have unsaved changes.\n\n" +
                "Save them before switching?"
            );
        if (save) {
            try {
                await saveFile();
            }
            catch (error) {
                return;
            }
        }
    }
    currentProject = selected;
    currentFile = null;
    cm.setValue(
        ""
    );
    editor.dataset.saved = "";
    filename.textContent = "No file selected";
    dirtyIndicator.style.display = "none";
    await loadFiles();
    if (bottomTab === "terminal") {
        ensureTerminalConnected();
    }
}
/* =====================================================
   LOAD FILES
===================================================== */
async function loadFiles() {
    if (!currentProject) {
        return;
    }
    try {
        const data =
            await api(
                `/api/projects/${encodeURIComponent(
                    currentProject
                )}/files`
            );
        const container = document.getElementById("files");
        container.innerHTML = "";
        if (
            data.files.length === 0
        ) {
            container.innerHTML =
                `
                <div class="empty-files">
                    No files.
                </div>
                `;
            return;
        }
        for (
            const path
            of data.files
        ) {
            const item =
                document.createElement(
                    "div"
                );
            item.className = "file";
            if (
                path === currentFile
            ) {
                item.classList.add(
                    "active"
                );
            }
            const icon =
                document.createElement(
                    "span"
                );
            icon.className = "file-icon";
            icon.textContent =
                path.endsWith(".py")
                    ? "🐍"
                    : "📄";
            const name =
                document.createElement(
                    "span"
                );
            name.className = "file-name";
            name.textContent = path;
            item.appendChild(
                icon
            );
            item.appendChild(
                name
            );
            item.title = path;
            /*
             * Left click / tap: open the file. Right click
             * (desktop) or a long press (touch) instead opens
             * the rename/delete menu for that file.
             */
            let longPressTimer = null;
            let longPressFired = false;
            item.oncontextmenu =
                (event) => {
                    event.preventDefault();
                    showFileContextMenu(
                        path,
                        event.clientX,
                        event.clientY
                    );
                };
            item.addEventListener(
                "pointerdown",
                (event) => {
                    if (
                        event.pointerType !== "touch"
                    ) {
                        return;
                    }
                    longPressFired = false;
                    longPressTimer =
                        setTimeout(
                            () => {
                                longPressFired = true;
                                if (
                                    navigator.vibrate
                                ) {
                                    navigator.vibrate(
                                        15
                                    );
                                }
                                showFileContextMenu(
                                    path,
                                    event.clientX,
                                    event.clientY
                                );
                            },
                            550
                        );
                }
            );
            const cancelLongPress =
                () => {
                    if (
                        longPressTimer
                    ) {
                        clearTimeout(
                            longPressTimer
                        );
                        longPressTimer = null;
                    }
                };
            item.addEventListener(
                "pointerup",
                cancelLongPress
            );
            item.addEventListener(
                "pointermove",
                cancelLongPress
            );
            item.addEventListener(
                "pointercancel",
                cancelLongPress
            );
            item.onclick =
                () => {
                    if (
                        longPressFired
                    ) {
                        longPressFired = false;
                        return;
                    }
                    openFile(
                        path
                    );
                };
            container.appendChild(
                item
            );
        }
        /*
         * Open first file
         * automatically.
         */
        if (
            !currentFile &&
            data.files.length > 0
        ) {
            await openFile(
                data.files[0]
            );
        }
    }
    catch (error) {
        output.textContent =
            "Could not load files:\n" +
            error.message;
    }
}
/* =====================================================
   OPEN FILE
===================================================== */
async function openFile(
    path
) {
    /*
     * Detect unsaved changes.
     */
    if (
        currentFile &&
        cm.getValue() !==
        editor.dataset.saved
    ) {
        const save =
            confirm(
                "You have unsaved changes.\n\n" +
                "Save them?"
            );
        if (save) {
            try {
                await saveFile();
            }
            catch (error) {
                return;
            }
        }
    }
    try {
        const data =
            await api(
                `/api/projects/${encodeURIComponent(
                    currentProject
                )}/file?path=${encodeURIComponent(
                    path
                )}`
            );
        currentFile = path;
        cm.setValue(
            data.content
        );
        editor.dataset.saved = data.content;
        filename.textContent = path;
        dirtyIndicator.style.display = "none";
        /*
         * On mobile, opening a file should close the
         * drawer and bring the editor into view.
         */
        if (
            isMobile()
        ) {
            closeSidebar();
            setMobileView(
                "editor"
            );
        }
        await loadFiles();
    }
    catch (error) {
        output.textContent =
            "Could not open file:\n" +
            error.message;
    }
}
/* =====================================================
   SAVE FILE
===================================================== */
async function saveFile() {
    if (
        !currentProject
    ) {
        return;
    }
    if (
        !currentFile
    ) {
        return;
    }
    try {
        await api(
            `/api/projects/${encodeURIComponent(
                currentProject
            )}/file`,
            {
                method: "POST",
                headers: {
                    "Content-Type":
                        "application/json"
                },
                body:
                    JSON.stringify({
                        path:
                            currentFile,
                        content:
                            cm.getValue()
                    })
            }
        );
        editor.dataset.saved =
            cm.getValue();
        dirtyIndicator.style.display = "none";
        output.textContent =
            "Saved:\n" +
            currentFile;
        await loadFiles();
    }
    catch (error) {
        output.textContent =
            "Save failed:\n" +
            error.message;
        throw error;
    }
}
/* =====================================================
   NEW FILE
===================================================== */
async function newFile() {

/* =====================================================
   RUN PROJECT
===================================================== */
async function runCurrent() {
    if (
        !currentProject
    ) {
        output.textContent = "No project selected.";
        return;
    }
    if (
        !currentFile
    ) {
        output.textContent = "Select a Python file first.";
        return;
    }
    if (
        !currentFile.endsWith(".py")
    ) {
        output.textContent = "Only Python files can be run.";
        return;
    }
    /*
     * Save before running.
     */
    if (
        cm.getValue() !==
        editor.dataset.saved
    ) {
        try {
            await saveFile();
        }
        catch {
            return;
        }
    }
    /*
     * Running now happens in the real interactive
     * terminal instead of the old sandboxed/timed-out
     * subprocess call. This means:
     *
     *  - no artificial time limit
     *  - input() prompts actually work
     *  - normal stdout/stderr colors and formatting
     *  - the process can be interrupted with Ctrl+C
     *    directly in the terminal
     *
     * On mobile this also switches to the Output/Terminal
     * tab so the user doesn't have to switch manually.
     */
    if (
        isMobile()
    ) {
        setMobileView(
            "output"
        );
    }
    sendTerminalCommand(
        "python3 -u " +
        shellQuote(currentFile)
    );
}
/* =====================================================
   EDITOR
   (dirty-state tracking and Tab handling now live on the
   CodeMirror instance itself - see cm.on("change", ...)
   and extraKeys.Tab set up where `cm` is created above.)
===================================================== */
/*
 * Ctrl+S / Cmd+S
 */
document.addEventListener(
    "keydown",
    async function(event) {
        if (
            (event.ctrlKey ||
             event.metaKey)
            &&
            event.key.toLowerCase()
                === "s"
        ) {
            event.preventDefault();
            await saveFile();
        }
    }
);
/*
 * Ctrl+Enter / Cmd+Enter
 * runs the current file.
 */
document.addEventListener(
    "keydown",
    function(event) {
        if (
            (event.ctrlKey ||
             event.metaKey)
            &&
            event.key === "Enter"
        ) {
            event.preventDefault();
            runCurrent();
        }
    }
);
/* =====================================================
   LIVE CAMERA (phone camera -> server OpenCV -> back)
===================================================== */
let cameraStream = null;
let cameraSocket = null;
let cameraRunning = false;
let cameraFacingMode = "environment";
let cameraCaptureTimer = null;
let cameraFramesInFlight = 0;
let cameraFpsCount = 0;
let cameraFpsTimer = null;
function setCameraStatus(status, title) {
    cameraStatusDot.className =
        "term-status-dot" +
        (status !== "disconnected" ? " " + status : "");
    cameraStatusDot.title = title || status;
}
function toggleCamera() {
    if (cameraRunning) {
        stopCamera("Stopped");
    } else {
        startCamera();
    }
}
async function startCamera() {
    if (!currentProject) {
        alert("Open or create a project first.");
        return;
    }
    if (
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
    ) {
        alert(
            "This browser doesn't support camera access " +
            "(getUserMedia)."
        );
        return;
    }
    cameraStartBtn.disabled = true;
    setCameraStatus("connecting", "Starting camera...");
    try {
        cameraStream =
            await navigator.mediaDevices.getUserMedia({
                video: { facingMode: cameraFacingMode },
                audio: false
            });
    } catch (error) {
        cameraStartBtn.disabled = false;
        setCameraStatus("error", String(error));
        alert(
            "Couldn't access the camera: " +
            (error && error.message
                ? error.message
                : error)
        );
        return;
    }
    cameraVideoEl.srcObject = cameraStream;
    await cameraVideoEl.play().catch(() => {});
    const proto =
        location.protocol === "https:" ? "wss:" : "ws:";
    cameraSocket = new WebSocket(
        proto +
        "//" +
        location.host +
        "/ws/projects/" +
        encodeURIComponent(currentProject) +
        "/camera"
    );
    cameraSocket.binaryType = "arraybuffer";
    cameraSocket.onopen = () => {
        cameraRunning = true;
        cameraStartBtn.disabled = false;
        cameraStartBtn.textContent = "⏹ Stop";
        setCameraStatus("connected", "Streaming");
        cameraPlaceholder.classList.add("hide");
        cameraDisplayCanvas.classList.add("show");
        cameraFpsEl.classList.add("show");
        cameraFpsCount = 0;
        clearInterval(cameraFpsTimer);
        cameraFpsTimer = setInterval(() => {
            cameraFpsEl.textContent =
                cameraFpsCount + " fps";
            cameraFpsCount = 0;
        }, 1000);
        startCameraCaptureLoop();
        loadFiles();
    };
    cameraSocket.onmessage = (event) => {
        cameraFramesInFlight = Math.max(
            0, cameraFramesInFlight - 1
        );
        cameraFpsCount++;
        const blob = new Blob(
            [event.data], { type: "image/jpeg" }
        );
        createImageBitmap(blob).then((bitmap) => {
            cameraDisplayCanvas.width = bitmap.width;
            cameraDisplayCanvas.height = bitmap.height;
            cameraDisplayCanvas
                .getContext("2d")
                .drawImage(bitmap, 0, 0);
            bitmap.close();
        }).catch(() => {});
    };
    cameraSocket.onerror = () => {
        setCameraStatus("error", "Connection error");
    };
    cameraSocket.onclose = () => {
        stopCamera(
            cameraRunning ? "Connection closed" : null
        );
    };
}
function startCameraCaptureLoop() {
    const ctx = cameraCaptureCanvas.getContext("2d");
    /*
     * Capped resolution + a modest ~10fps interval keeps
     * bandwidth and server CPU (OpenCV runs per frame, in
     * a worker thread) reasonable on a phone connection.
     */
    const MAX_W = 480;
    clearInterval(cameraCaptureTimer);
    cameraCaptureTimer = setInterval(() => {
        if (
            !cameraRunning ||
            !cameraSocket ||
            cameraSocket.readyState !== WebSocket.OPEN
        ) {
            return;
        }
        const vw = cameraVideoEl.videoWidth;
        const vh = cameraVideoEl.videoHeight;
        if (!vw || !vh) {
            return;
        }
        /*
         * Basic backpressure: if the server hasn't finished
         * processing recent frames yet, skip capturing a new
         * one rather than piling up a backlog and falling
         * further and further behind real time.
         */
        if (cameraFramesInFlight >= 2) {
            return;
        }
        const scale = Math.min(1, MAX_W / vw);
        const w = Math.round(vw * scale);
        const h = Math.round(vh * scale);
        cameraCaptureCanvas.width = w;
        cameraCaptureCanvas.height = h;
        ctx.drawImage(cameraVideoEl, 0, 0, w, h);
        cameraCaptureCanvas.toBlob(
            (blob) => {
                if (
                    blob &&
                    cameraSocket &&
                    cameraSocket.readyState ===
                        WebSocket.OPEN
                ) {
                    cameraFramesInFlight++;
                    cameraSocket.send(blob);
                }
            },
            "image/jpeg",
            0.7
        );
    }, 100);
}
function stopCamera(statusTitle) {
    cameraRunning = false;
    clearInterval(cameraCaptureTimer);
    cameraCaptureTimer = null;
    clearInterval(cameraFpsTimer);
    cameraFpsTimer = null;
    cameraFpsEl.classList.remove("show");
    if (cameraSocket) {
        try {
            cameraSocket.onclose = null;
            cameraSocket.close();
        } catch {}
        cameraSocket = null;
    }
    if (cameraStream) {
        cameraStream
            .getTracks()
            .forEach((track) => track.stop());
        cameraStream = null;
    }
    cameraVideoEl.srcObject = null;
    cameraStartBtn.disabled = false;
    cameraStartBtn.textContent = "▶ Start";
    cameraDisplayCanvas.classList.remove("show");
    cameraPlaceholder.classList.remove("hide");
    setCameraStatus(
        "disconnected",
        statusTitle || "Stopped"
    );
}
function switchCameraFacing() {
    cameraFacingMode =
        cameraFacingMode === "environment"
            ? "user"
            : "environment";
    if (cameraRunning) {
        stopCamera(null);
        startCamera();
    }
}
/* =====================================================
   START APPLICATION
===================================================== */
loadProjects();
