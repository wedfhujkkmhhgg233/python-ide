<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Python IDE</title>


    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {

            margin: 0;

            padding: 0;

            width: 100%;

            height: 100%;

            /*
             * 100dvh accounts for mobile browser chrome
             * (address bar, nav bar) showing/hiding, so the
             * layout doesn't get cut off or leave a gap on
             * phones. Falls back to 100% on browsers that
             * don't support dvh.
             */
            height: 100dvh;

            overflow: hidden;

        }


        body {

            display: flex;

            flex-direction: column;

            background: #0d1117;

            color: #e6edf3;

            font-family:
                Arial,
                sans-serif;

        }


        /* =========================
           HEADER
        ========================= */

        header {

            height: 56px;

            min-height: 56px;

            display: flex;

            align-items: center;

            gap: 7px;

            padding:
                0 10px;

            background: #161b22;

            border-bottom:
                1px solid #30363d;

        }


        .logo {

            display: flex;

            align-items: center;

            gap: 7px;

            font-size: 16px;

            font-weight: bold;

            margin-right: auto;

            white-space: nowrap;

        }


        .logo-icon {

            font-size: 20px;

        }


        button {

            border:
                1px solid #30363d;

            border-radius: 6px;

            padding:
                8px 11px;

            background: #21262d;

            color: #e6edf3;

            font-size: 13px;

            cursor: pointer;

            white-space: nowrap;

        }


        button:hover {

            background: #30363d;

        }


        button:active {

            transform:
                translateY(1px);

        }


        button:disabled {

            opacity: 0.5;

            cursor:
                not-allowed;

        }


        .run-button {

            background: #238636;

            border-color:
                #2ea043;

        }


        .run-button:hover {

            background: #2ea043;

        }


        /* =========================
           MOBILE HAMBURGER + DRAWER
           (hidden on desktop; enabled
           in the mobile media query
           below)
        ========================= */

        #hamburger {

            display: none;

            width: 36px;
            height: 36px;
            padding: 0;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;

        }


        #backdrop {

            display: none;

            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 90;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;

        }


        #backdrop.show {

            opacity: 1;
            pointer-events: auto;

        }


        /* =========================
           MOBILE BOTTOM TAB BAR
           (Editor / Output switch;
           hidden on desktop)
        ========================= */

        #mobileTabs {

            display: none;

            height: 52px;
            min-height: 52px;
            background: #161b22;
            border-top: 1px solid #30363d;

        }


        #mobileTabs button {

            flex: 1;
            border: none;
            border-radius: 0;
            border-right: 1px solid #30363d;
            background: transparent;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            font-size: 11px;
            color: #8b949e;

        }


        #mobileTabs button:last-child {

            border-right: none;

        }


        #mobileTabs button.active {

            background: #21262d;
            color: #58a6ff;

        }


        /* =========================
           MAIN WORKSPACE
        ========================= */

        #workspace {

            flex: 1;

            min-height: 0;

            display: flex;

        }


        /* =========================
           SIDEBAR
        ========================= */

        #sidebar {

            width: 235px;

            min-width: 235px;

            display: flex;

            flex-direction: column;

            background: #161b22;

            border-right:
                1px solid #30363d;

        }


        .sidebar-header {

            height: 46px;

            display: flex;

            align-items: center;

            gap: 6px;

            padding:
                7px;

            border-bottom:
                1px solid #30363d;

        }


        #projectSelect {

            flex: 1;

            min-width: 0;

            height: 31px;

            padding:
                0 7px;

            border:
                1px solid #30363d;

            border-radius: 5px;

            outline: none;

            background: #0d1117;

            color: #e6edf3;

        }


        .small-button {

            width: 31px;

            height: 31px;

            padding: 0;

            font-size: 16px;

        }


        .files-title {

            padding:
                10px 10px 5px;

            color: #8b949e;

            font-size: 11px;

            font-weight: bold;

            letter-spacing: 0.5px;

        }


        #files {

            flex: 1;

            min-height: 0;

            padding:
                4px 7px 10px;

            overflow-y: auto;

        }


        .file {

            display: flex;

            align-items: center;

            gap: 7px;

            width: 100%;

            padding:
                8px 8px;

            border-radius: 5px;

            color: #c9d1d9;

            font-family:
                monospace;

            font-size: 13px;

            cursor: pointer;

            user-select: none;

        }


        .file:hover {

            background: #21262d;

        }


        .file.active {

            background: #30363d;

            color: white;

        }


        .file-icon {

            flex-shrink: 0;

        }


        .file-name {

            overflow: hidden;

            text-overflow: ellipsis;

            white-space: nowrap;

        }


        .empty-files {

            padding: 12px 9px;

            color: #8b949e;

            font-size: 12px;

        }


        /* =========================
           EDITOR AREA
        ========================= */

        #main {

            flex: 1;

            min-width: 0;

            display: flex;

            flex-direction: column;

        }


        #filebar {

            height: 38px;

            min-height: 38px;

            display: flex;

            align-items: center;

            padding:
                0 12px;

            background: #0d1117;

            border-bottom:
                1px solid #30363d;

        }


        #filename {

            font-family:
                monospace;

            font-size: 13px;

            color: #c9d1d9;

            overflow: hidden;

            text-overflow: ellipsis;

            white-space: nowrap;

        }


        #dirty {

            margin-left: 7px;

            color: #f0f6fc;

            display: none;

        }


        #editor {

            flex: 1;

            width: 100%;

            min-height: 0;

            resize: none;

            border: none;

            outline: none;

            padding:
                15px;

            background: #0d1117;

            color: #e6edf3;

            font-family:
                "Courier New",
                monospace;

            font-size: 15px;

            line-height: 1.55;

            tab-size: 4;

            white-space: pre;

            overflow: auto;

        }


        #editor::placeholder {

            color: #484f58;

        }


        /* =========================
           TERMINAL
        ========================= */

        #terminal {

            height: 190px;

            min-height: 120px;

            display: flex;

            flex-direction: column;

            background: #010409;

            border-top:
                1px solid #30363d;

        }


        .terminal-header {

            height: 36px;

            min-height: 36px;

            display: flex;

            align-items: center;

            padding:
                0 12px;

            border-bottom:
                1px solid #21262d;

            color: #8b949e;

            font-size: 12px;

            font-weight: bold;

        }


        #output {

            flex: 1;

            min-height: 0;

            margin: 0;

            padding:
                11px 12px;

            overflow: auto;

            white-space: pre-wrap;

            word-break: break-word;

            color: #e6edf3;

            font-family:
                "Courier New",
                monospace;

            font-size: 13px;

            line-height: 1.5;

        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 700px) {

            header {

                padding:
                    0 7px;

                gap: 4px;

            }


            .logo {

                font-size: 14px;

            }


            .logo-icon {

                font-size: 18px;

            }


            button {

                /* larger tap targets on touch screens */
                min-height: 40px;

                padding:
                    8px 10px;

                font-size: 12px;

            }


            #hamburger {

                display: flex;

            }


            /*
             * Sidebar becomes a slide-in drawer that overlays
             * the workspace instead of squeezing the editor
             * into a sliver of the screen.
             */
            #sidebar {

                position: fixed;
                top: 56px;
                left: 0;
                bottom: 0;

                width: 82vw;
                max-width: 300px;
                min-width: 0;

                z-index: 100;

                transform: translateX(-100%);
                transition: transform 0.22s ease;

                box-shadow: 2px 0 16px rgba(0, 0, 0, 0.55);

            }


            #sidebar.open {

                transform: translateX(0);

            }


            #backdrop {

                display: block;
                top: 56px;

            }


            #mobileTabs {

                display: flex;

            }


            /*
             * Only one of Editor / Output is shown at a time
             * on mobile, controlled by data-mobile-view on
             * <body>, and switched via #mobileTabs.
             */
            body[data-mobile-view="editor"] #terminal {

                display: none;

            }


            body[data-mobile-view="output"] #editor,
            body[data-mobile-view="output"] #filebar {

                display: none;

            }


            body[data-mobile-view="output"] #terminal {

                flex: 1;
                height: auto;

            }


            #terminal {

                height: 100%;

            }


            #editor {

                /* keep >=16px so iOS/Android don't zoom in on focus */
                font-size: 16px;

            }


            #projectSelect {

                font-size: 16px;

            }

        }


        @media (max-width: 480px) {

            .logo-text {

                display: none;

            }


            #sidebar {

                width: 86vw;

            }


            button {

                font-size: 11px;

                padding:
                    8px 8px;

            }

        }

    </style>

</head>


<body data-mobile-view="editor">


<!-- =========================
     HEADER
========================= -->

<header>


    <button
        id="hamburger"
        onclick="toggleSidebar()"
        title="Projects & files"
        aria-label="Open projects and files"
    >
        ☰
    </button>


    <div class="logo">

        <span class="logo-icon">
            🐍
        </span>

        <span class="logo-text">
            Python IDE
        </span>

    </div>


    <button
        onclick="newProject()"
        title="Create a new project"
    >
        ＋ Project
    </button>


    <button
        onclick="newFile()"
        title="Create a new file"
    >
        ＋ File
    </button>


    <button
        onclick="saveFile()"
        title="Save current file"
    >
        💾 Save
    </button>


    <button
        id="runButton"
        class="run-button"
        onclick="runCurrent()"
        title="Run current Python file"
    >
        ▶ Run
    </button>


</header>



<!-- =========================
     WORKSPACE
========================= -->

<!-- Tapping the backdrop closes the mobile drawer -->
<div
    id="backdrop"
    onclick="closeSidebar()"
></div>


<div id="workspace">


    <!-- =====================
         SIDEBAR
    ====================== -->

    <aside id="sidebar">


        <div class="sidebar-header">


            <select
                id="projectSelect"
                onchange="switchProject()"
            >
            </select>


            <button
                class="small-button"
                onclick="newProject()"
                title="New project"
            >
                ＋
            </button>


        </div>


        <div class="files-title">

            PROJECT FILES

        </div>


        <div id="files">

            <div class="empty-files">
                Loading...
            </div>

        </div>


    </aside>



    <!-- =====================
         MAIN
    ====================== -->

    <main id="main">


        <div id="filebar">


            <span id="filename">

                No file selected

            </span>


            <span id="dirty">
                ●
            </span>


        </div>



        <textarea
            id="editor"
            spellcheck="false"
            autocomplete="off"
            autocorrect="off"
            autocapitalize="off"
            placeholder="Select a file..."
        ></textarea>



        <!-- =================
             TERMINAL
        ================== -->

        <section id="terminal">


            <div class="terminal-header">

                TERMINAL / OUTPUT

            </div>


            <pre id="output">Ready.</pre>


        </section>


    </main>


</div>


<!-- =========================
     MOBILE TAB BAR
     (switches between the
     code editor and the
     terminal/output on small
     screens; hidden on desktop)
========================= -->

<nav id="mobileTabs">

    <button
        id="tabEditorBtn"
        class="active"
        onclick="setMobileView('editor')"
    >
        <span>📝</span>
        <span>Editor</span>
    </button>

    <button
        id="tabOutputBtn"
        onclick="setMobileView('output')"
    >
        <span>💻</span>
        <span>Output</span>
    </button>

</nav>



<script>


/* =====================================================
   STATE
===================================================== */


let currentProject = null;

let currentFile = null;



const editor =
    document.getElementById(
        "editor"
    );


const output =
    document.getElementById(
        "output"
    );


const projectSelect =
    document.getElementById(
        "projectSelect"
    );


const filename =
    document.getElementById(
        "filename"
    );


const dirtyIndicator =
    document.getElementById(
        "dirty"
    );


const runButton =
    document.getElementById(
        "runButton"
    );


const sidebarEl =
    document.getElementById(
        "sidebar"
    );


const backdropEl =
    document.getElementById(
        "backdrop"
    );


const tabEditorBtn =
    document.getElementById(
        "tabEditorBtn"
    );


const tabOutputBtn =
    document.getElementById(
        "tabOutputBtn"
    );


const isMobile = () =>
    window.matchMedia(
        "(max-width: 700px)"
    ).matches;



/* =====================================================
   MOBILE: SIDEBAR DRAWER
===================================================== */


function openSidebar() {

    sidebarEl.classList.add(
        "open"
    );

    backdropEl.classList.add(
        "show"
    );

}


function closeSidebar() {

    sidebarEl.classList.remove(
        "open"
    );

    backdropEl.classList.remove(
        "show"
    );

}


function toggleSidebar() {

    if (
        sidebarEl.classList.contains(
            "open"
        )
    ) {

        closeSidebar();

    }

    else {

        openSidebar();

    }

}



/* =====================================================
   MOBILE: EDITOR / OUTPUT TABS
===================================================== */


function setMobileView(
    view
) {

    document.body.setAttribute(
        "data-mobile-view",
        view
    );

    tabEditorBtn.classList.toggle(
        "active",
        view === "editor"
    );

    tabOutputBtn.classList.toggle(
        "active",
        view === "output"
    );

}



/* =====================================================
   API HELPER
===================================================== */


async function api(
    url,
    options = {}
) {


    const response =
        await fetch(
            url,
            options
        );


    let data;


    try {

        data =
            await response.json();

    }

    catch {

        throw new Error(
            "Server returned invalid data."
        );

    }


    if (!response.ok) {

        throw new Error(
            data.error ||
            "Request failed."
        );

    }


    return data;

}



/* =====================================================
   LOAD PROJECTS
===================================================== */


async function loadProjects() {


    try {


        const data =
            await api(
                "/api/projects"
            );


        projectSelect.innerHTML =
            "";


        for (
            const project
            of data.projects
        ) {


            const option =
                document.createElement(
                    "option"
                );


            option.value =
                project.id;


            option.textContent =
                project.name;


            projectSelect.appendChild(
                option
            );

        }



        /*
         * If there are no projects,
         * automatically create one.
         */

        if (
            data.projects.length === 0
        ) {


            await createDefaultProject();


            return;

        }



        /*
         * Select first project.
         */

        currentProject =
            data.projects[0].id;


        projectSelect.value =
            currentProject;


        currentFile = null;


        await loadFiles();


    }

    catch (error) {


        output.textContent =
            "Startup error:\n" +
            error.message;

    }

}



/* =====================================================
   DEFAULT PROJECT
===================================================== */


async function createDefaultProject() {


    const data =
        await api(
            "/api/projects",
            {

                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body:
                    JSON.stringify({

                        name:
                            "my-project"

                    })

            }
        );


    currentProject =
        data.id;


    projectSelect.innerHTML =
        "";


    const option =
        document.createElement(
            "option"
        );


    option.value =
        data.id;


    option.textContent =
        data.name;


    projectSelect.appendChild(
        option
    );


    await loadFiles();

}



/* =====================================================
   NEW PROJECT
===================================================== */


async function newProject() {


    const name =
        prompt(
            "Project name:",
            "my-project"
        );


    if (
        name === null
    ) {

        return;

    }


    const trimmed =
        name.trim();


    if (!trimmed) {

        alert(
            "Project name cannot be empty."
        );

        return;

    }


    try {


        const data =
            await api(
                "/api/projects",
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            name:
                                trimmed

                        })

                }
            );


        currentProject =
            data.id;


        currentFile =
            null;


        await loadProjects();


        projectSelect.value =
            data.id;


        currentProject =
            data.id;


        await loadFiles();


        output.textContent =
            "Created project:\n" +
            data.id;


    }

    catch (error) {


        alert(
            "Could not create project:\n" +
            error.message
        );

    }

}



/* =====================================================
   SWITCH PROJECT
===================================================== */


async function switchProject() {


    const selected =
        projectSelect.value;


    if (!selected) {

        return;

    }


    /*
     * Warn about unsaved changes.
     */

    if (
        currentFile &&
        editor.value !==
        editor.dataset.saved
    ) {


        const save =
            confirm(
                "You have unsaved changes.\n\n" +
                "Save them before switching?"
            );


        if (save) {

            try {

                await saveFile();

            }

            catch (error) {

                return;

            }

        }

    }


    currentProject =
        selected;


    currentFile =
        null;


    editor.value =
        "";


    editor.dataset.saved =
        "";


    filename.textContent =
        "No file selected";


    dirtyIndicator.style.display =
        "none";


    await loadFiles();

}



/* =====================================================
   LOAD FILES
===================================================== */


async function loadFiles() {


    if (!currentProject) {

        return;

    }


    try {


        const data =
            await api(
                `/api/projects/${encodeURIComponent(
                    currentProject
                )}/files`
            );


        const container =
            document.getElementById(
                "files"
            );


        container.innerHTML =
            "";


        if (
            data.files.length === 0
        ) {


            container.innerHTML =
                `
                <div class="empty-files">
                    No files.
                </div>
                `;


            return;

        }



        for (
            const path
            of data.files
        ) {


            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "file";


            if (
                path === currentFile
            ) {

                item.classList.add(
                    "active"
                );

            }


            const icon =
                document.createElement(
                    "span"
                );


            icon.className =
                "file-icon";


            icon.textContent =
                path.endsWith(".py")
                    ? "🐍"
                    : "📄";


            const name =
                document.createElement(
                    "span"
                );


            name.className =
                "file-name";


            name.textContent =
                path;


            item.appendChild(
                icon
            );


            item.appendChild(
                name
            );


            item.title =
                path;


            item.onclick =
                () => openFile(path);


            container.appendChild(
                item
            );

        }



        /*
         * Open first file
         * automatically.
         */

        if (
            !currentFile &&
            data.files.length > 0
        ) {


            await openFile(
                data.files[0]
            );

        }


    }

    catch (error) {


        output.textContent =
            "Could not load files:\n" +
            error.message;

    }

}



/* =====================================================
   OPEN FILE
===================================================== */


async function openFile(
    path
) {


    /*
     * Detect unsaved changes.
     */

    if (
        currentFile &&
        editor.value !==
        editor.dataset.saved
    ) {


        const save =
            confirm(
                "You have unsaved changes.\n\n" +
                "Save them?"
            );


        if (save) {

            try {

                await saveFile();

            }

            catch (error) {

                return;

            }

        }

    }


    try {


        const data =
            await api(
                `/api/projects/${encodeURIComponent(
                    currentProject
                )}/file?path=${encodeURIComponent(
                    path
                )}`
            );


        currentFile =
            path;


        editor.value =
            data.content;


        editor.dataset.saved =
            data.content;


        filename.textContent =
            path;


        dirtyIndicator.style.display =
            "none";


        /*
         * On mobile, opening a file should close the
         * drawer and bring the editor into view.
         */

        if (
            isMobile()
        ) {

            closeSidebar();

            setMobileView(
                "editor"
            );

        }


        await loadFiles();


    }

    catch (error) {


        output.textContent =
            "Could not open file:\n" +
            error.message;

    }

}



/* =====================================================
   SAVE FILE
===================================================== */


async function saveFile() {


    if (
        !currentProject
    ) {

        return;

    }


    if (
        !currentFile
    ) {

        return;

    }


    try {


        await api(
            `/api/projects/${encodeURIComponent(
                currentProject
            )}/file`,
            {

                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body:
                    JSON.stringify({

                        path:
                            currentFile,

                        content:
                            editor.value

                    })

            }
        );


        editor.dataset.saved =
            editor.value;


        dirtyIndicator.style.display =
            "none";


        output.textContent =
            "Saved:\n" +
            currentFile;


        await loadFiles();


    }

    catch (error) {


        output.textContent =
            "Save failed:\n" +
            error.message;


        throw error;

    }

}



/* =====================================================
   NEW FILE
===================================================== */


async function newFile() {


    if (!currentProject) {


        alert(
            "Create a project first."
        );


        return;

    }


    const path =
        prompt(
            "File path:",
            "test.py"
        );


    if (
        path === null
    ) {

        return;

    }


    const cleanPath =
        path.trim();


    if (!cleanPath) {

        return;

    }


    try {


        await api(
            `/api/projects/${encodeURIComponent(
                currentProject
            )}/file`,
            {

                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body:
                    JSON.stringify({

                        path:
                            cleanPath,

                        content:
                            ""

                    })

            }
        );


        await loadFiles();


        await openFile(
            cleanPath
        );


        output.textContent =
            "Created:\n" +
            cleanPath;


    }

    catch (error) {


        alert(
            "Could not create file:\n" +
            error.message
        );

    }

}



/* =====================================================
   RUN PROJECT
===================================================== */


async function runCurrent() {


    if (
        !currentProject
    ) {


        output.textContent =
            "No project selected.";


        return;

    }


    if (
        !currentFile
    ) {


        output.textContent =
            "Select a Python file first.";


        return;

    }


    if (
        !currentFile.endsWith(".py")
    ) {


        output.textContent =
            "Only Python files can be run.";


        return;

    }



    /*
     * Save before running.
     */

    if (
        editor.value !==
        editor.dataset.saved
    ) {


        try {

            await saveFile();

        }

        catch {

            return;

        }

    }



    runButton.disabled =
        true;


    runButton.textContent =
        "Running...";


    output.textContent =
        "Running project...\n\n" +
        "Entry file: " +
        currentFile;


    /*
     * On mobile, jump to the Output tab so the user
     * doesn't have to switch manually to see the result.
     */

    if (
        isMobile()
    ) {

        setMobileView(
            "output"
        );

    }



    try {


        /*
         * IMPORTANT:
         *
         * We now call:
         *
         * /api/projects/{project}/run
         *
         * instead of the old /run endpoint.
         *
         * The backend copies the entire
         * project into a temporary directory.
         *
         * Therefore imports such as:
         *
         * from utils import add
         *
         * work correctly.
         */

        const data =
            await api(
                `/api/projects/${encodeURIComponent(
                    currentProject
                )}/run`,
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            entry:
                                currentFile

                        })

                }
            );



        let text =
            "";


        /*
         * Standard output.
         */

        if (
            data.stdout
        ) {

            text +=
                data.stdout;

        }


        /*
         * Errors / stderr.
         */

        if (
            data.stderr
        ) {


            if (text) {

                text +=
                    "\n";

            }


            text +=
                data.stderr;

        }


        if (!text) {

            text =
                "(No output)";

        }


        /*
         * Add exit status.
         */

        text +=
            "\n\n--- Process exited with code " +
            data.returncode +
            " ---";


        output.textContent =
            text;


    }

    catch (error) {


        output.textContent =
            "Run failed:\n\n" +
            error.message;

    }


    finally {


        runButton.disabled =
            false;


        runButton.textContent =
            "▶ Run";

    }

}



/* =====================================================
   EDITOR
===================================================== */


editor.addEventListener(
    "input",
    function() {


        if (
            editor.value !==
            editor.dataset.saved
        ) {

            dirtyIndicator.style.display =
                "inline";

        }

        else {

            dirtyIndicator.style.display =
                "none";

        }

    }
);



/*
 * TAB support.
 */

editor.addEventListener(
    "keydown",
    function(event) {


        if (
            event.key === "Tab"
        ) {


            event.preventDefault();


            const start =
                editor.selectionStart;


            const end =
                editor.selectionEnd;


            editor.value =
                editor.value.substring(
                    0,
                    start
                )
                +
                "    "
                +
                editor.value.substring(
                    end
                );


            editor.selectionStart =
                start + 4;


            editor.selectionEnd =
                start + 4;


            editor.dispatchEvent(
                new Event("input")
            );

        }

    }
);



/*
 * Ctrl+S / Cmd+S
 */

document.addEventListener(
    "keydown",
    async function(event) {


        if (
            (event.ctrlKey ||
             event.metaKey)
            &&
            event.key.toLowerCase()
                === "s"
        ) {


            event.preventDefault();


            await saveFile();

        }

    }
);



/*
 * Ctrl+Enter / Cmd+Enter
 * runs the current file.
 */

document.addEventListener(
    "keydown",
    function(event) {


        if (
            (event.ctrlKey ||
             event.metaKey)
            &&
            event.key === "Enter"
        ) {


            event.preventDefault();


            runCurrent();

        }

    }
);



/* =====================================================
   START APPLICATION
===================================================== */


loadProjects();

</script>
