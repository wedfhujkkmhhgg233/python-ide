<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#12161e">
    <title>Python IDE</title>
    <!-- =========================
         CODE EDITOR (CodeMirror)
         Provides syntax highlighting,
         auto-indent, bracket matching,
         and auto-closing brackets.
    ========================= -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css"
    >
    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"
    ></script>
    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"
    ></script>
    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"
    ></script>
    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"
    ></script>
    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/selection/active-line.min.js"
    ></script>
    <!-- =========================
         TERMINAL (xterm.js)
         A real, interactive terminal
         attached to a shell process
         running server-side.
    ========================= -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.min.css"
    >
    <script
        src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.min.js"
    ></script>
    <script
        src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.min.js"
    ></script>
    <script
        src="https://cdn.jsdelivr.net/npm/@xterm/addon-webgl@0.18.0/lib/addon-webgl.min.js"
    ></script>
    <script
        src="https://cdn.jsdelivr.net/npm/@xterm/addon-canvas@0.7.0/lib/addon-canvas.min.js"
    ></script>
    <link rel="stylesheet" href="/static/style.css">

</head>
<body data-mobile-view="editor">
<!-- =========================
     HEADER
========================= -->
<header>
    <button
        id="hamburger"
        onclick="toggleSidebar()"
        title="Projects & files"
        aria-label="Open projects and files"
    >
        ☰
    </button>
    <div class="logo">
        <span class="logo-icon">
            🐍
        </span>
        <span class="logo-text">
            Python IDE
        </span>
    </div>
    <div id="toolbarMoreWrap">
        <button
            id="moreToolbarBtn"
            onclick="toggleMoreToolbarMenu()"
            title="More actions"
            aria-label="More actions"
        >
            ⋯
        </button>
        <div id="toolbarMore">
            <button
                onclick="hideMoreToolbarMenu(); newProject()"
                title="Create a new project"
            >
                ＋ Project
            </button>
            <button
                onclick="hideMoreToolbarMenu(); newFile()"
                title="Create a new file"
            >
                ＋ File
            </button>
            <button
                onclick="hideMoreToolbarMenu(); newFolder()"
                title="Create a new folder"
            >
                ＋ Folder
            </button>
            <button
                onclick="hideMoreToolbarMenu(); triggerUpload('')"
                title="Upload files - zips are auto-extracted"
            >
                ⬆ Upload
            </button>
            <button
                id="installButton"
                onclick="hideMoreToolbarMenu(); installRequirements()"
                title="pip install -r requirements.txt"
            >
                📦 Install
            </button>
        </div>
    </div>
    <input
        type="file"
        id="uploadInput"
        multiple
        style="display:none"
        onchange="handleUploadInputChange()"
    >
    <button
        onclick="saveFile()"
        title="Save current file"
    >
        💾 Save
    </button>
    <button
        id="runButton"
        class="run-button"
        onclick="runCurrent()"
        title="Run current Python file in the terminal"
    >
        ▶ Run
    </button>
</header>
<!-- =========================
     WORKSPACE
========================= -->
<!-- Tapping the backdrop closes the mobile drawer -->
<div
    id="backdrop"
    onclick="closeSidebar()"
></div>
<div id="workspace">
    <!-- =====================
         SIDEBAR
    ====================== -->
    <aside id="sidebar">
        <div class="sidebar-header">
            <select
                id="projectSelect"
                onchange="switchProject()"
            >
            </select>
            <button
                class="small-button"
                onclick="newProject()"
                title="New project"
                aria-label="New project"
            >
                ＋
            </button>
        </div>
        <div class="files-title">
            PROJECT FILES
        </div>
        <div id="files">
            <div class="empty-files">
                Loading...
            </div>
        </div>
    </aside>
    <!-- =====================
         MAIN
    ====================== -->
    <main id="main">
        <div id="filebar">
            <span id="filename">
                No file selected
            </span>
            <span id="dirty">
                ●
            </span>
            <button
                id="deleteLineBtn"
                onclick="deleteCurrentLines(cm); cm.focus();"
                title="Delete current line (Ctrl+Shift+K)"
            >
                🗑️ Line
            </button>
        </div>
        <textarea
            id="editor"
            spellcheck="false"
            autocomplete="off"
            autocorrect="off"
            autocapitalize="off"
            placeholder="Select a file..."
        ></textarea>
        <!-- =================
             TERMINAL
        ================== -->
        <section id="terminal">
            <div class="terminal-header">
                <div class="term-tabs">
                    <button
                        id="outputTabBtn"
                        class="term-tab active"
                        onclick="setBottomTab('output')"
                    >
                        OUTPUT
                    </button>
                    <button
                        id="terminalTabBtn"
                        class="term-tab"
                        onclick="setBottomTab('terminal')"
                    >
                        TERMINAL
                    </button>
                    <button
                        id="cameraTabBtn"
                        class="term-tab"
                        onclick="setBottomTab('camera')"
                    >
                        📷 CAMERA
                    </button>
                </div>
                <div
                    id="terminalToolbar"
                    class="term-toolbar"
                >
                    <span
                        id="termStatusDot"
                        class="term-status-dot"
                        title="Disconnected"
                    ></span>
                    <button
                        class="term-tool-btn"
                        onclick="copyTerminalOutput()"
                        title="Copy selection (or all output if nothing selected)"
                    >
                        📋 Copy
                    </button>
                    <button
                        class="term-tool-btn"
                        onclick="restartTerminal()"
                        title="Start a fresh shell"
                    >
                        ⟳ Restart
                    </button>
                    <button
                        class="term-tool-btn"
                        onclick="clearTerminalView()"
                        title="Clear the screen"
                    >
                        🧹 Clear
                    </button>
                </div>
                <div
                    id="cameraToolbar"
                    class="term-toolbar"
                >
                    <span
                        id="cameraStatusDot"
                        class="term-status-dot"
                        title="Stopped"
                    ></span>
                    <button
                        class="term-tool-btn"
                        id="cameraStartBtn"
                        onclick="toggleCamera()"
                    >
                        ▶ Start
                    </button>
                    <button
                        class="term-tool-btn"
                        onclick="switchCameraFacing()"
                        title="Switch front/back camera"
                    >
                        🔄 Flip
                    </button>
                </div>
            </div>
            <div
                id="outputPane"
                class="term-pane active"
            >
                <pre id="output">Ready.</pre>
            </div>
            <div
                id="xtermPane"
                class="term-pane"
            >
                <div id="xtermContainer"></div>
                <div id="termToast"></div>
            </div>
            <div
                id="cameraPane"
                class="term-pane"
            >
                <div id="cameraStage">
                    <video
                        id="cameraVideoEl"
                        autoplay
                        playsinline
                        muted
                    ></video>
                    <canvas id="cameraCaptureCanvas"></canvas>
                    <canvas id="cameraDisplayCanvas"></canvas>
                    <div id="cameraPlaceholder">
                        📷 This runs your project's
                        camera.py live on your phone's
                        camera - hit Start, allow camera
                        access, and edit camera.py to
                        change what happens to the feed.
                    </div>
                    <div id="cameraFps"></div>
                </div>
            </div>
        </section>
    </main>
</div>
<!-- =========================
     MOBILE TAB BAR
     (switches between the
     code editor and the
     terminal/output on small
     screens; hidden on desktop)
========================= -->
<nav id="mobileTabs">
    <button
        id="tabEditorBtn"
        class="active"
        onclick="setMobileView('editor')"
    >
        <span>📝</span>
        <span>Editor</span>
    </button>
    <button
        id="tabOutputBtn"
        onclick="setMobileView('output')"
    >
        <span>💻</span>
        <span>Output</span>
    </button>
</nav>
<!-- =========================
     FILE CONTEXT MENU
     (right-click or long-press
     a file in the sidebar)
========================= -->
<div id="fileContextMenu">
    <button
        id="newFileHereBtn"
        onclick="newFileFromMenu()"
    >
        📄 New File
    </button>
    <button
        id="newFolderHereBtn"
        onclick="newFolderFromMenu()"
    >
        📁 New Folder
    </button>
    <button
        id="uploadHereBtn"
        onclick="uploadFromMenu()"
    >
        ⬆ Upload Here
    </button>
    <button
        id="renameFileBtn"
        onclick="renameSelectedFile()"
    >
        ✏️ Rename
    </button>
    <button
        id="deleteFileBtn"
        class="danger"
        onclick="deleteSelectedFile()"
    >
        🗑️ Delete
    </button>
</div>
<script src="/static/app.js"></script>
</body>
</html>
