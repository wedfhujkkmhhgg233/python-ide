<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#12161e">
    <title>Python IDE</title>
    <!-- =========================
         CODE EDITOR (CodeMirror)
         Provides syntax highlighting,
         auto-indent, bracket matching,
         and auto-closing brackets.
    ========================= -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css"
    >
    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"
    ></script>
    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"
    ></script>
    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"
    ></script>
    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"
    ></script>
    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/selection/active-line.min.js"
    ></script>
    <!-- =========================
         TERMINAL (xterm.js)
         A real, interactive terminal
         attached to a shell process
         running server-side.
    ========================= -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.min.css"
    >
    <script
        src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.min.js"
    ></script>
    <script
        src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.min.js"
    ></script>
    <script
        src="https://cdn.jsdelivr.net/npm/@xterm/addon-webgl@0.18.0/lib/addon-webgl.min.js"
    ></script>
    <script
        src="https://cdn.jsdelivr.net/npm/@xterm/addon-canvas@0.7.0/lib/addon-canvas.min.js"
    ></script>
    <link rel="stylesheet" href="/static/style.css">

</head>
<body data-mobile-view="editor">
<svg style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true">
<defs>
<symbol id="i-menu" viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></symbol>
<symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1.6" fill="currentColor" stroke="none"/></symbol>
<symbol id="i-plus" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></symbol>
<symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 15V4"/><path d="M6 9l6-6 6 6"/><path d="M4 19h16"/></symbol>
<symbol id="i-package" viewBox="0 0 24 24"><path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></symbol>
<symbol id="i-save" viewBox="0 0 24 24"><path d="M5 4h11l3 3v13H5z"/><path d="M8 4v5h7V4"/><rect x="8" y="14" width="8" height="6"/></symbol>
<symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z" fill="currentColor" stroke="none"/></symbol>
<symbol id="i-square" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1.5" fill="currentColor" stroke="none"/></symbol>
<symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="M6 7l1 13h10l1-13"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></symbol>
<symbol id="i-copy" viewBox="0 0 24 24"><rect x="4" y="4" width="12" height="12" rx="1.5"/><path d="M8 16v3a1 1 0 0 0 1 1h11a1 1 0 0 0 1-1V9a1 1 0 0 0-1-1h-3"/></symbol>
<symbol id="i-refresh" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></symbol>
<symbol id="i-clear" viewBox="0 0 24 24"><path d="M19 20H8l-6-6L12 4l9 9-6 6z"/><path d="M13 4l7 7"/></symbol>
<symbol id="i-camera" viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13.5" r="3.5"/></symbol>
<symbol id="i-file" viewBox="0 0 24 24"><path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5"/></symbol>
<symbol id="i-file-plus" viewBox="0 0 24 24"><path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5"/><line x1="12" y1="13" x2="12" y2="19"/><line x1="9" y1="16" x2="15" y2="16"/></symbol>
<symbol id="i-folder" viewBox="0 0 24 24"><path d="M4 6h6l2 2h8v11H4z"/></symbol>
<symbol id="i-folder-plus" viewBox="0 0 24 24"><path d="M4 6h6l2 2h8v11H4z"/><line x1="12" y1="12" x2="12" y2="17"/><line x1="9.5" y1="14.5" x2="14.5" y2="14.5"/></symbol>
<symbol id="i-chevron" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></symbol>
<symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20l1-4L16 5l3 3L8 19z"/><path d="M14 6l3 3"/></symbol>
<symbol id="i-code" viewBox="0 0 24 24"><path d="M9 8l-5 4 5 4"/><path d="M15 8l5 4-5 4"/></symbol>
<symbol id="i-terminal" viewBox="0 0 24 24"><path d="M5 7l5 5-5 5"/><line x1="12" y1="17" x2="19" y2="17"/></symbol>
<symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 3l10 18H2z"/><line x1="12" y1="9" x2="12" y2="14"/><circle cx="12" cy="17.5" r="0.9" fill="currentColor" stroke="none"/></symbol>
<symbol id="i-more-vertical" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.6" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="12" cy="19" r="1.6" fill="currentColor" stroke="none"/></symbol>
<symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><line x1="20" y1="20" x2="15.5" y2="15.5"/></symbol>
<symbol id="i-zap" viewBox="0 0 24 24"><path d="M13 2 4 14h6l-1 8 9-12h-6z"/></symbol>
</defs>
</svg>
<!-- =========================
     HEADER
========================= -->
<header>
    <button
        id="hamburger"
        onclick="toggleSidebar()"
        title="Projects & files"
        aria-label="Open projects and files"
    >
        <svg class="icon"><use href="#i-menu"></use></svg>
    </button>
    <div class="logo">
        <span class="logo-icon" aria-hidden="true">
            <svg class="icon icon-lg"><use href="#i-code"></use></svg>
        </span>
        <span class="logo-text">
            Python IDE
        </span>
    </div>
    <div id="toolbarMoreWrap">
        <button
            id="moreToolbarBtn"
            onclick="toggleMoreToolbarMenu()"
            title="More actions"
            aria-label="More actions"
        >
            <svg class="icon"><use href="#i-more"></use></svg>
        </button>
        <div id="toolbarMore">
            <button
                onclick="hideMoreToolbarMenu(); openCommandPalette()"
                title="Command palette (Ctrl+Shift+P)"
            >
                <svg class="icon"><use href="#i-zap"></use></svg> Command Palette
            </button>
            <button
                onclick="hideMoreToolbarMenu(); openFileSwitcher()"
                title="Go to file (Ctrl+P)"
            >
                <svg class="icon"><use href="#i-search"></use></svg> Go to File
            </button>
            <button
                onclick="hideMoreToolbarMenu(); newProject()"
                title="Create a new project"
            >
                <svg class="icon"><use href="#i-plus"></use></svg> New Project
            </button>
            <button
                onclick="hideMoreToolbarMenu(); newFile()"
                title="Create a new file"
            >
                <svg class="icon"><use href="#i-file-plus"></use></svg> New File
            </button>
            <button
                onclick="hideMoreToolbarMenu(); newFolder()"
                title="Create a new folder"
            >
                <svg class="icon"><use href="#i-folder-plus"></use></svg> New Folder
            </button>
            <button
                onclick="hideMoreToolbarMenu(); triggerUpload('')"
                title="Upload files - zips are auto-extracted"
            >
                <svg class="icon"><use href="#i-upload"></use></svg> Upload
            </button>
            <button
                id="installButton"
                onclick="hideMoreToolbarMenu(); installRequirements()"
                title="pip install -r requirements.txt"
            >
                <svg class="icon"><use href="#i-package"></use></svg> Install
            </button>
        </div>
    </div>
    <input
        type="file"
        id="uploadInput"
        multiple
        style="display:none"
        onchange="handleUploadInputChange()"
    >
    <button
        onclick="saveFile()"
        title="Save current file"
    >
        <svg class="icon"><use href="#i-save"></use></svg> Save
    </button>
    <button
        id="runButton"
        class="run-button"
        onclick="runCurrent()"
        title="Run current Python file in the terminal"
    >
        <svg class="icon"><use href="#i-play"></use></svg> Run
    </button>
</header>
<!-- =========================
     WORKSPACE
========================= -->
<!-- Tapping the backdrop closes the mobile drawer -->
<div
    id="backdrop"
    onclick="closeSidebar()"
></div>
<div id="workspace">
    <!-- =====================
         SIDEBAR
    ====================== -->
    <aside id="sidebar">
        <div class="sidebar-header">
            <select
                id="projectSelect"
                onchange="switchProject()"
            >
            </select>
            <button
                class="small-button"
                onclick="newProject()"
                title="New project"
                aria-label="New project"
            >
                <svg class="icon"><use href="#i-plus"></use></svg>
            </button>
        </div>
        <div class="files-title">
            Explorer
        </div>
        <div id="files">
            <div class="explorer-state">
                <span
                    class="explorer-state-icon spin"
                    aria-hidden="true"
                ><svg class="icon icon-lg"><use href="#i-refresh"></use></svg></span>
                <div class="explorer-state-title">Loading projects…</div>
            </div>
        </div>
    </aside>
    <!-- =====================
         MAIN
    ====================== -->
    <main id="main">
        <div id="filebar">
            <span id="filename">
                No file selected
            </span>
            <span
                id="dirty"
                title="Unsaved changes"
                aria-label="Unsaved changes"
            ></span>
            <button
                id="deleteLineBtn"
                onclick="deleteCurrentLines(cm); cm.focus();"
                title="Delete current line (Ctrl+Shift+K)"
            >
                <svg class="icon"><use href="#i-trash"></use></svg> Line
            </button>
        </div>
        <textarea
            id="editor"
            spellcheck="false"
            autocomplete="off"
            autocorrect="off"
            autocapitalize="off"
            placeholder="Select a file..."
        ></textarea>
        <!-- =================
             EDITOR STATUS BAR
             Reflects CodeMirror's
             real cursor state -
             nothing here is faked.
        ================== -->
        <div id="editorStatusBar">
            <span id="statusLang">Python</span>
            <span id="statusPos">Ln 1, Col 1</span>
            <span id="statusIndent">Spaces: 4</span>
            <span id="statusEncoding">UTF-8</span>
        </div>
        <!-- =================
             MOBILE CODING TOOLBAR
             Quick-insert row for
             characters that are
             painful to reach on a
             phone keyboard. Inserts
             at the real CodeMirror
             cursor position.
        ================== -->
        <div
            id="mobileCodeToolbar"
            role="toolbar"
            aria-label="Quick-insert characters"
        >
            <button type="button" onclick="mobileInsertText('    ')">Tab</button>
            <button type="button" onclick="mobileInsertPair('{', '}')">{ }</button>
            <button type="button" onclick="mobileInsertPair('(', ')')">( )</button>
            <button type="button" onclick="mobileInsertPair('[', ']')">[ ]</button>
            <button type="button" onclick="mobileInsertText(':')">:</button>
            <button type="button" onclick="mobileInsertText('=')">=</button>
            <button type="button" onclick="mobileInsertText('\'')">'</button>
            <button type="button" onclick="mobileInsertText('_')">_</button>
            <button
                type="button"
                onclick="mobileMoveCursor(-1)"
                aria-label="Move cursor left"
            ><svg class="icon"><use href="#i-chevron"></use></svg></button>
            <button
                type="button"
                onclick="mobileMoveCursor(1)"
                aria-label="Move cursor right"
            ><svg class="icon icon-flip"><use href="#i-chevron"></use></svg></button>
        </div>
        <!-- Drag handle to resize the terminal panel (desktop) -->
        <div
            id="terminalResizeHandle"
            role="separator"
            aria-orientation="horizontal"
            aria-label="Resize terminal panel"
            tabindex="0"
        ></div>
        <!-- =================
             TERMINAL
        ================== -->
        <section id="terminal">
            <div class="terminal-header">
                <div class="term-tabs">
                    <button
                        id="outputTabBtn"
                        class="term-tab active"
                        onclick="setBottomTab('output')"
                    >
                        OUTPUT
                    </button>
                    <button
                        id="terminalTabBtn"
                        class="term-tab"
                        onclick="setBottomTab('terminal')"
                    >
                        TERMINAL
                    </button>
                    <button
                        id="cameraTabBtn"
                        class="term-tab"
                        onclick="setBottomTab('camera')"
                    >
                        <svg class="icon"><use href="#i-camera"></use></svg> Camera
                    </button>
                </div>
                <div
                    id="terminalToolbar"
                    class="term-toolbar"
                >
                    <span
                        id="termStatusDot"
                        class="term-status-dot"
                        title="Disconnected"
                    ></span>
                    <button
                        class="term-tool-btn"
                        onclick="copyTerminalOutput()"
                        title="Copy selection (or all output if nothing selected)"
                    >
                        <svg class="icon"><use href="#i-copy"></use></svg> Copy
                    </button>
                    <button
                        class="term-tool-btn"
                        onclick="restartTerminal()"
                        title="Start a fresh shell"
                    >
                        <svg class="icon"><use href="#i-refresh"></use></svg> Restart
                    </button>
                    <button
                        class="term-tool-btn"
                        onclick="clearTerminalView()"
                        title="Clear the screen"
                    >
                        <svg class="icon"><use href="#i-clear"></use></svg> Clear
                    </button>
                </div>
                <div
                    id="cameraToolbar"
                    class="term-toolbar"
                >
                    <span
                        id="cameraStatusDot"
                        class="term-status-dot"
                        title="Stopped"
                    ></span>
                    <button
                        class="term-tool-btn"
                        id="cameraStartBtn"
                        onclick="toggleCamera()"
                    >
                        <span class="btn-icon"><svg class="icon"><use href="#i-play"></use></svg></span><span class="btn-label">Start</span>
                    </button>
                    <button
                        class="term-tool-btn"
                        onclick="switchCameraFacing()"
                        title="Switch front/back camera"
                    >
                        <svg class="icon"><use href="#i-refresh"></use></svg> Flip
                    </button>
                </div>
            </div>
            <div
                id="outputPane"
                class="term-pane active"
            >
                <pre id="output">Ready.</pre>
            </div>
            <div
                id="xtermPane"
                class="term-pane"
            >
                <div id="xtermContainer"></div>
                <div id="termToast"></div>
            </div>
            <div
                id="cameraPane"
                class="term-pane"
            >
                <div id="cameraStage">
                    <video
                        id="cameraVideoEl"
                        autoplay
                        playsinline
                        muted
                    ></video>
                    <canvas id="cameraCaptureCanvas"></canvas>
                    <canvas id="cameraDisplayCanvas"></canvas>
                    <div id="cameraPlaceholder">
                        <span class="empty-state-icon" aria-hidden="true"><svg class="icon icon-xl"><use href="#i-camera"></use></svg></span>
                        <span class="empty-state-title">Camera preview</span>
                        <span class="empty-state-text">This runs your project's
                        camera.py live on your phone's
                        camera - hit Start, allow camera
                        access, and edit camera.py to
                        change what happens to the feed.</span>
                    </div>
                    <div id="cameraFps"></div>
                </div>
            </div>
        </section>
    </main>
</div>
<!-- =========================
     MOBILE TAB BAR
     (switches between the
     code editor and the
     terminal/output on small
     screens; hidden on desktop)
========================= -->
<nav id="mobileTabs">
    <button
        id="tabEditorBtn"
        class="active"
        onclick="setMobileView('editor')"
    >
        <span aria-hidden="true"><svg class="icon"><use href="#i-code"></use></svg></span>
        <span>Editor</span>
    </button>
    <button
        id="tabOutputBtn"
        onclick="setMobileView('output')"
    >
        <span aria-hidden="true"><svg class="icon"><use href="#i-terminal"></use></svg></span>
        <span>Output</span>
    </button>
</nav>
<!-- =========================
     FILE CONTEXT MENU
     (right-click or long-press
     a file in the sidebar)
========================= -->
<div id="fileContextMenu">
    <button
        id="newFileHereBtn"
        onclick="newFileFromMenu()"
    >
        <svg class="icon"><use href="#i-file-plus"></use></svg> New File
    </button>
    <button
        id="newFolderHereBtn"
        onclick="newFolderFromMenu()"
    >
        <svg class="icon"><use href="#i-folder-plus"></use></svg> New Folder
    </button>
    <button
        id="uploadHereBtn"
        onclick="uploadFromMenu()"
    >
        <svg class="icon"><use href="#i-upload"></use></svg> Upload Here
    </button>
    <button
        id="renameFileBtn"
        onclick="renameSelectedFile()"
    >
        <svg class="icon"><use href="#i-edit"></use></svg> Rename
    </button>
    <button
        id="deleteFileBtn"
        class="danger"
        onclick="deleteSelectedFile()"
    >
        <svg class="icon"><use href="#i-trash"></use></svg> Delete
    </button>
</div>
<!-- =========================
     QUICK PICKER
     Shared overlay for the
     Command Palette
     (Ctrl/Cmd+Shift+P) and
     Go to File (Ctrl/Cmd+P).
========================= -->
<div id="quickPicker" role="dialog" aria-modal="true" aria-label="Quick picker">
    <div class="quick-picker-panel">
        <div class="quick-picker-input-row">
            <svg class="icon"><use id="quickPickerIcon" href="#i-search"></use></svg>
            <input
                id="quickPickerInput"
                type="text"
                autocomplete="off"
                autocorrect="off"
                autocapitalize="off"
                spellcheck="false"
                placeholder="Go to file…"
                aria-label="Quick picker search"
            >
        </div>
        <div
            id="quickPickerList"
            role="listbox"
            aria-label="Results"
        ></div>
        <div id="quickPickerEmpty" class="quick-picker-empty" hidden>
            No matches
        </div>
    </div>
</div>
<script src="/static/app.js"></script>
</body>
</html>
